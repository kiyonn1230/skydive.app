/* ============================================================================
   v1.1 — 追加機能ブロック C（CA側）
   11. CAごとの毎月の売上達成率
   12. 達成率のグラフ可視化
   すべてダミーデータ。本番では基幹システム／成約管理から取り込む想定。
============================================================================ */

const MONTHS = ['3月','4月','5月','6月','7月','8月'];

/* CAごとの月次実績（万円）。決定論的に生成し、リロードしても変わらない。 */
function caSales(caId){
  const meta = CA_LIST.find(x=>x.id===caId) || CA_LIST[0];
  const r = rng(hash('sales:'+caId));
  const target = meta.target;
  const months = MONTHS.map((m,i)=>{
    const base = target * (0.62 + r()*0.62);
    const actual = Math.round(base/10)*10;
    return {m, target, actual, rate: Math.round(actual/target*100)};
  });
  // 当月（末尾）は進行中。月初だと実績が小さく出るのは当然なので、
  // 「着地見込」を主指標、「当月実績（MTD）」を補助指標として持たせる。
  const last = months[months.length-1];
  const pace = clamp(new Date().getDate()/30, 0.1, 1);   // 月の進捗率
  const fullRate = 0.78 + r()*0.5;                        // 着地見込の達成率（78〜128%）
  last.forecast = Math.round((last.target * fullRate)/10)*10;
  last.forecastRate = Math.round(last.forecast/last.target*100);
  last.actual = Math.round((last.forecast * pace)/10)*10; // 月内の進捗分だけ積み上がっている
  last.rate = Math.round(last.actual/last.target*100);
  last.pace = Math.round(pace*100);
  last.inProgress = true;
  const ytd = months.reduce((s,x)=>s+x.actual,0);
  const ytdTarget = target*months.length;
  return {ca:meta, months, current:last, ytd, ytdTarget, ytdRate: Math.round(ytd/ytdTarget*100)};
}
function allCaSales(){ return CA_LIST.map(c=>caSales(c.id)); }
function rateTone(r){ return r>=100 ? 'ok' : r>=80 ? 'warn' : 'bad'; }

/* ---- 12. グラフ（外部ライブラリを使わずインラインSVGで描く） ---- */
function barChartSvg(data, opts){
  const o = opts||{};
  const W = o.w||520, H = o.h||168, padL=34, padB=22, padT=14;
  const max = Math.max(120, ...data.map(d=>Math.max(d.rate, d.forecastRate||0)));
  const iw = W-padL-8, ih = H-padB-padT;
  const bw = iw/data.length;
  const y = v => padT + ih - (v/max)*ih;
  const grid = [0,50,100].map(g=>`
    <line x1="${padL}" y1="${y(g)}" x2="${W-8}" y2="${y(g)}" stroke="${g===100?'#C8503C':'#DED7CA'}"
          stroke-width="1" ${g===100?'stroke-dasharray="4 3"':''}/>
    <text x="${padL-6}" y="${y(g)+3}" text-anchor="end" font-size="8.5" fill="#A29A92">${g}</text>`).join('');
  const bars = data.map((d,i)=>{
    const x = padL + i*bw + bw*0.22;
    const w = bw*0.56;
    const tone = d.rate>=100 ? '#3F6B4F' : d.rate>=80 ? '#8A6B2F' : '#A83A2C';
    const fc = d.forecastRate && d.forecastRate>d.rate
      ? `<rect x="${x}" y="${y(d.forecastRate)}" width="${w}" height="${Math.max(y(d.rate)-y(d.forecastRate),0)}"
              fill="${tone}" opacity=".22"/>` : '';
    return `${fc}
      <rect x="${x}" y="${y(d.rate)}" width="${w}" height="${Math.max(padT+ih-y(d.rate),1)}" fill="${tone}"/>
      <text x="${x+w/2}" y="${y(d.rate)-4}" text-anchor="middle" font-size="8.5" fill="#3D3733" font-weight="700">${d.rate}</text>
      <text x="${x+w/2}" y="${H-7}" text-anchor="middle" font-size="9" fill="#736A63">${esc(d.m)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="月次の売上達成率グラフ" preserveAspectRatio="xMidYMid meet">${grid}${bars}</svg>`;
}
function sparkSvg(months){
  const W=104,H=26, max=Math.max(120,...months.map(m=>m.rate));
  const pts = months.map((m,i)=>[ (i/(months.length-1))*(W-2)+1, H-2-(m.rate/max)*(H-6) ]);
  const d = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last = months[months.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    <line x1="1" y1="${H-2-(100/max)*(H-6)}" x2="${W-1}" y2="${H-2-(100/max)*(H-6)}" stroke="#DED7CA" stroke-dasharray="3 2"/>
    <path d="${d}" fill="none" stroke="#14110F" stroke-width="1.4"/>
    <circle cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="2.6"
            fill="${last.rate>=100?'#3F6B4F':last.rate>=80?'#8A6B2F':'#A83A2C'}"/>
  </svg>`;
}
function donutSvg(rate, size){
  const s = size||96, r = s/2-8, c = 2*Math.PI*r, v = Math.min(rate,150)/150;
  const tone = rate>=100 ? '#3F6B4F' : rate>=80 ? '#8A6B2F' : '#A83A2C';
  return `<svg viewBox="0 0 ${s} ${s}" width="${s}" height="${s}" aria-hidden="true">
    <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="#EDE8DD" stroke-width="7"/>
    <circle cx="${s/2}" cy="${s/2}" r="${r}" fill="none" stroke="${tone}" stroke-width="7"
      stroke-dasharray="${(c*v).toFixed(1)} ${c.toFixed(1)}" stroke-linecap="butt"
      transform="rotate(-90 ${s/2} ${s/2})"/>
    <text x="${s/2}" y="${s/2+1}" text-anchor="middle" dominant-baseline="middle"
      font-family="serif" font-size="21" fill="#14110F">${rate}</text>
    <text x="${s/2}" y="${s/2+16}" text-anchor="middle" font-size="8" fill="#A29A92">%</text>
  </svg>`;
}

/* ============================================================================
   v1.2 — 将来構想の実装
   A. データモデルを「求職者主語」→「案件(application)主語」へ
   B. RA（企業担当）とロール分離
   C. 社長 / CA / RA / 企業 / 求職者 の5ロール
   D. 構造化行動ログ（CA底上げの学習ループの土台）
   DESIGN_NOTES.md の指摘をそのまま実装に落としたもの。
============================================================================ */

/* ---------------------------------------------------------------------------
   RA（リクルーティングアドバイザー）= 企業側担当
--------------------------------------------------------------------------- */
const RA_LIST = [
  {id:'ra1', name:'岡田 剛',   role:'RA・7年目', target:900},
  {id:'ra2', name:'三浦 涼',   role:'RA・2年目', target:480}
];
function raOf(companyId){ return RA_LIST[hash('ra:'+companyId) % RA_LIST.length].id; }

/* 企業ごとの求人枠。RA側の「充足率」の分母になる。 */
function openingsOf(co){
  const r = rng(hash('open:'+co.id));
  return 1 + Math.floor(r()*4);
}

/* 紹介手数料の想定額（万円）= 想定年収 × 30% */
function feeOf(co){ return Math.round(((co.pay[0]+co.pay[1])/2) * 0.30 / 5) * 5; }

/* ---------------------------------------------------------------------------
   A. 案件（application）
   求職者と企業の「間」に実体を置く。CA・RA・選考ステージ・推薦経路を全てここに持たせる。
   これにより、同じ企業への再応募も、企業側からの視点も表現できる。
--------------------------------------------------------------------------- */
const STAGE_LABELS = STAGES;   // ['応募検討','応募中','面接調整中','面接済み','内定']

function buildApplications(){
  if(state.apps && state.apps.length) return state.apps;
  const apps = [];
  SEED_CANDIDATES.forEach(cand=>{
    const r = rng(hash('app:'+cand.id));
    const topStage = {applying:1, scheduling:2, interviewed:3, offer:4}[cand.st];
    const n = Math.max(1, Math.min(cand.matched, 1 + Math.floor(r()*3)));
    const used = {};
    for(let i=0;i<n;i++){
      let co, guard=0;
      do { co = COMPANIES[Math.floor(r()*COMPANIES.length)]; guard++; } while(used[co.id] && guard<24);
      if(used[co.id]) continue;
      used[co.id] = 1;
      apps.push({
        id: cand.id+'#'+co.id,
        candId: cand.id,
        companyId: co.id,
        caId: cand.ca,
        raId: raOf(co.id),
        // i>0 の一部は stage0（応募検討＝まだ本人が応募に同意していない）。
        // 企業ポータルでの「同意前はマスクする」挙動を実際に確認できるようにするため。
        stage: i===0 ? topStage : Math.max(0, topStage - 1 - Math.floor(r()*3)),
        source: r() < 0.64 ? 'ai' : 'ca',      // 推薦経路（効果測定の要）
        daysOpen: 3 + Math.floor(r()*40),
        fee: feeOf(co),
        clientRating: null                      // 企業側が入力する評価
      });
    }
  });
  state.apps = apps;
  return apps;
}
/* デモで操作中の求職者は state から動的に案件化する */
function liveApplications(){
  const live = liveCandidate();
  if(!live) return [];
  return state.liked.map(cid=>{
    const co = state.scored.find(c=>c.id===cid);
    if(!co) return null;
    return {
      id:'live#'+cid, candId:'live', companyId:cid, caId:'ca1', raId:raOf(cid),
      stage: stageOf(cid),
      source: (state.superLiked||[]).includes(cid) ? 'ca' : 'ai',
      daysOpen: 0, fee: feeOf(co), clientRating: state.clientRatings ? state.clientRatings['live#'+cid] : null,
      live:true
    };
  }).filter(Boolean);
}
function allApplications(){ return liveApplications().concat(buildApplications()); }
function appsForCompany(id){ return allApplications().filter(a=>a.companyId===id); }
function appsForRa(id){ return allApplications().filter(a=>a.raId===id); }
function appsForCa(id){ return allApplications().filter(a=>a.caId===id); }
function candOf(id){ return allCandidates().find(c=>c.id===id); }
function coOf(id){ return COMPANIES.find(c=>c.id===id); }

/* ---------------------------------------------------------------------------
   D. 構造化行動ログ
   DESIGN_NOTES の「文字列ではなく構造化して持つ」に対応。
   段階3（学習ループ）は、このログの粒度がないと成立しない。
--------------------------------------------------------------------------- */
function logEvent(action, meta){
  state.events = state.events || [];
  state.events.unshift({
    at: Date.now(),
    actorId: meta && meta.actorId || 'live',
    actorRole: meta && meta.actorRole || state.mode,
    applicationId: meta && meta.applicationId || null,
    action: action,                  // recommend / meeting / message / log_add / stage_change / rate
    meta: meta || {}
  });
  if(state.events.length > 200) state.events.pop();
}

/* ---------------------------------------------------------------------------
   直近6ヶ月の完了案件（経営指標のサンプル母数）
   現在のパイプライン（31件）だけでは成約率の比較に耐える母数がないため、
   完了済みの案件を別に持つ。運用画面は「現在」、経営画面は「直近6ヶ月」を見る。
   ※ 数値はすべて説明用のサンプルであり、実績ではない。
--------------------------------------------------------------------------- */
const HIST_N = 240;
const CA_SKILL = {ca1:1.25, ca2:0.70, ca3:1.00};   // CAごとの実力差（ばらつきの可視化用）
function historyApps(){
  if(state.hist && state.hist.length) return state.hist;
  const r = rng(20260805);
  const out = [];
  for(let i=0;i<HIST_N;i++){
    const co = COMPANIES[Math.floor(r()*COMPANIES.length)];
    const ca = CA_LIST[Math.floor(r()*CA_LIST.length)];
    const source = r() < 0.62 ? 'ai' : 'ca';
    const base = source==='ai' ? 0.17 : 0.12;        // サンプル前提値
    const won = r() < base * (CA_SKILL[ca.id]||1);
    out.push({companyId:co.id, caId:ca.id, raId:raOf(co.id), source, won,
              fee:feeOf(co), month:1+Math.floor(r()*6)});
  }
  state.hist = out;
  return out;
}

/* ---------------------------------------------------------------------------
   集計：経営指標
--------------------------------------------------------------------------- */
function funnelStats(){
  const apps = allApplications();
  const at = s => apps.filter(a=>a.stage>=s).length;
  return [
    {l:'応募',       n:at(1)},
    {l:'面接調整',   n:at(2)},
    {l:'面接実施',   n:at(3)},
    {l:'内定',       n:at(4)}
  ];
}
/* AI推薦 vs CA手動推薦の成約率。直近6ヶ月の完了案件を母数にする。 */
function sourceStats(){
  const hist = historyApps();
  const mk = k => {
    const set = hist.filter(a=>a.source===k);
    const won = set.filter(a=>a.won).length;
    return {k, n:set.length, won, rate: set.length ? Math.round(won/set.length*100) : 0};
  };
  return {ai: mk('ai'), ca: mk('ca')};
}
/* CA別の生産性。経営が見たいのは平均ではなく「ばらつき」。 */
function caProductivity(){
  const hist = historyApps();
  const rows = CA_LIST.map(ca=>{
    const set = hist.filter(a=>a.caId===ca.id);
    const won = set.filter(a=>a.won);
    const cands = new Set(appsForCa(ca.id).map(a=>a.candId)).size;
    const rev = won.reduce((s,a)=>s+a.fee,0);
    return {ca, apps:set.length, cands, won:won.length,
            rate: set.length ? Math.round(won.length/set.length*100) : 0, rev};
  });
  const rates = rows.map(r=>r.rate);
  const mean = rates.reduce((a,b)=>a+b,0)/Math.max(rates.length,1);
  const sd = Math.sqrt(rates.reduce((s,v)=>s+(v-mean)**2,0)/Math.max(rates.length,1));
  return {rows, mean:Math.round(mean), sd:Math.round(sd),
          min:Math.min(...rates), max:Math.max(...rates)};
}
function execTotals(){
  const apps = allApplications();                 // 現在のパイプライン
  const hist = historyApps();                     // 直近6ヶ月の完了案件
  const won  = hist.filter(a=>a.won);
  const rev  = won.reduce((s,a)=>s+a.fee,0);
  const lead = Math.round(apps.reduce((s,a)=>s+a.daysOpen,0)/Math.max(apps.length,1));
  return {apps:apps.length, won:won.length, rev, lead,
          cands:new Set(apps.map(a=>a.candId)).size,
          histN:hist.length,
          rate: hist.length ? Math.round(won.length/hist.length*100) : 0};
}
/* RA向け：企業ごとの充足状況 */
function companyStats(id){
  const co = coOf(id);
  const set = appsForCompany(id);
  const open = openingsOf(co);
  const won = set.filter(a=>a.stage===4).length;
  const inProg = set.filter(a=>a.stage>=1 && a.stage<4).length;
  return {co, open, applied:set.length, inProg, won,
          fill: Math.min(100, Math.round(won/open*100)),
          pass: set.length ? Math.round(set.filter(a=>a.stage>=3).length/set.length*100) : 0};
}

/* ---------------------------------------------------------------------------
   C. CA底上げ（段階2）：行動指標の分布と自分の位置
--------------------------------------------------------------------------- */
const BEHAVIORS = [
  {k:'rec',  l:'1人あたり推薦社数', unit:'社', good:'多いほど選択肢が増え、成約率が上がる'},
  {k:'mtg',  l:'面談実施率',        unit:'%',  good:'初回面談が早いほど離脱が減る'},
  {k:'resp', l:'平均返信時間',      unit:'h',  good:'短いほど良い', invert:true},
  {k:'log',  l:'面接ログ登録数',    unit:'件', good:'登録するほど他CAの成果も上がる'}
];
function behaviorFor(caId){
  const r = rng(hash('bhv:'+caId));
  const set = appsForCa(caId);
  const cands = Math.max(1, new Set(set.map(a=>a.candId)).size);
  return {
    rec:  Math.round(set.length/cands*10)/10,
    mtg:  40 + Math.floor(r()*55),
    resp: Math.round((1 + r()*11)*10)/10,
    log:  Math.floor(r()*14)
  };
}
function behaviorTable(){
  const rows = CA_LIST.map(ca=>({ca, v:behaviorFor(ca.id)}));
  const stats = {};
  BEHAVIORS.forEach(b=>{
    const vals = rows.map(r=>r.v[b.k]);
    const best = b.invert ? Math.min(...vals) : Math.max(...vals);
    const avg = vals.reduce((a,c)=>a+c,0)/vals.length;
    stats[b.k] = {best, avg:Math.round(avg*10)/10, min:Math.min(...vals), max:Math.max(...vals)};
  });
  return {rows, stats};
}
/* トップCAとの差から、次に取るべき行動を出す */
function nextActionsFor(caId){
  const {stats} = behaviorTable();
  const v = behaviorFor(caId);
  const out = [];
  BEHAVIORS.forEach(b=>{
    const gap = b.invert ? (v[b.k] - stats[b.k].best) : (stats[b.k].best - v[b.k]);
    if(gap > 0.001){
      out.push({
        k:b.k, l:b.l, mine:v[b.k], best:stats[b.k].best, unit:b.unit,
        msg: b.invert
          ? '上位CAは'+stats[b.k].best+b.unit+'。あなたは'+v[b.k]+b.unit+'です。'+b.good
          : '上位CAは'+stats[b.k].best+b.unit+'。あなたは'+v[b.k]+b.unit+'です。'+b.good
      });
    }
  });
  return out.sort((a,b)=>Math.abs(b.best-b.mine)-Math.abs(a.best-a.mine)).slice(0,3);
}

/* ---------------------------------------------------------------------------
   グラフ部品（追加分）
--------------------------------------------------------------------------- */
function funnelSvg(data){
  const W=520, H=132, pad=8, bw=(W-pad*2)/data.length;
  const max = Math.max(...data.map(d=>d.n), 1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="選考ファネル">
    ${data.map((d,i)=>{
      const h = Math.max((d.n/max)*(H-46), 3);
      const x = pad + i*bw + bw*0.14, w = bw*0.72, y = H-30-h;
      const drop = i ? Math.round(d.n/data[i-1].n*100) : 100;
      return `
        <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#14110F" opacity="${1 - i*0.16}"/>
        <text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="12" font-family="serif" fill="#14110F">${d.n}</text>
        <text x="${x+w/2}" y="${H-14}" text-anchor="middle" font-size="9" fill="#736A63">${esc(d.l)}</text>
        ${i?`<text x="${x-bw*0.14}" y="${H-30-h/2}" text-anchor="middle" font-size="8.5" fill="#C8503C">${drop}%</text>`:''}`;
    }).join('')}
  </svg>`;
}
function dotPlotSvg(rows, mean, sd){
  const W=520, H=96, padL=10, padR=10, y=52;
  const vals = rows.map(r=>r.rate);
  const lo = Math.max(0, Math.min(...vals)-8), hi = Math.max(...vals)+8;
  const x = v => padL + ((v-lo)/Math.max(hi-lo,1))*(W-padL-padR);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="CA別成約率のばらつき">
    <rect x="${x(mean-sd)}" y="${y-15}" width="${Math.max(x(mean+sd)-x(mean-sd),2)}" height="30" fill="#C8503C" opacity=".10"/>
    <line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#DED7CA"/>
    <line x1="${x(mean)}" y1="${y-19}" x2="${x(mean)}" y2="${y+19}" stroke="#C8503C" stroke-dasharray="3 2"/>
    <text x="${x(mean)}" y="${y-24}" text-anchor="middle" font-size="8.5" fill="#C8503C">平均 ${mean}%</text>
    ${rows.map(r=>`
      <circle cx="${x(r.rate)}" cy="${y}" r="6" fill="#14110F"/>
      <text x="${x(r.rate)}" y="${y+27}" text-anchor="middle" font-size="8.5" fill="#3D3733">${esc(r.ca.name.split(' ')[0])}</text>
      <text x="${x(r.rate)}" y="${y+3.5}" text-anchor="middle" font-size="7.5" fill="#F5F1E8">${r.rate}</text>`).join('')}
    <text x="${padL}" y="${H-4}" font-size="8" fill="#A29A92">ばらつき（標準偏差）±${sd}pt — 小さいほど組織として強い</text>
  </svg>`;
}
function compareBarSvg(a, b){
  const W=520, H=104, max=Math.max(a.rate,b.rate,1), barH=26;
  const row = (d,i,label,color)=>{
    const w = (d.rate/max)*(W-150);
    const y = 16+i*44;
    return `
      <text x="0" y="${y+17}" font-size="10" fill="#3D3733">${esc(label)}</text>
      <rect x="94" y="${y}" width="${Math.max(w,2)}" height="${barH}" fill="${color}"/>
      <text x="${94+Math.max(w,2)+8}" y="${y+18}" font-size="14" font-family="serif" fill="#14110F">${d.rate}%</text>
      <text x="${94+Math.max(w,2)+52}" y="${y+18}" font-size="8.5" fill="#A29A92">${d.won}/${d.n}件</text>`;
  };
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="推薦経路別の成約率">
    ${row(a,0,'AI推薦経由','#C8503C')}${row(b,1,'CA手動推薦','#736A63')}
  </svg>`;

/* ============================================================================

function coachPanelHtml(){
  const sel = state.caCoachSel || CA_LIST[1].id;
  const {rows, stats} = behaviorTable();
  const me = rows.find(r=>r.ca.id===sel) || rows[0];
  const actions = nextActionsFor(sel);
  const prod = caProductivity();
  const myProd = prod.rows.find(r=>r.ca.id===sel);

  const scale = b => {
    const s = stats[b.k];
    const lo = Math.min(s.min, s.best) * 0.85;
    const hi = Math.max(s.max, s.best) * 1.15 || 1;
    const pos = v => Math.max(2, Math.min(98, ((v-lo)/Math.max(hi-lo,0.001))*100));
    const mine = me.v[b.k];
    const isBest = b.invert ? mine<=s.best : mine>=s.best;
    return `
      <div class="bhv-row">
        <div class="bhv-h">
          <span>${esc(b.l)}</span>
          <b>${mine}${esc(b.unit)}${isBest?' <span style="font-size:9px;color:var(--ok)">最上位</span>':''}</b>
        </div>
        <div class="bhv-scale">
          <div class="bhv-track"></div>
          <div class="bhv-mark avg" style="left:${pos(s.avg)}%"></div>
          <div class="bhv-lab" style="left:${pos(s.avg)}%">平均 ${s.avg}</div>
          <div class="bhv-mark best" style="left:${pos(s.best)}%"></div>
          <div class="bhv-lab" style="left:${pos(s.best)}%;top:-8px;color:var(--ok)">上位 ${s.best}</div>
          <div class="bhv-me" style="left:${pos(mine)}%" title="あなた"></div>
        </div>
        <div class="bhv-good">${esc(b.good)}</div>
      </div>`;
  };

  return `
  <div class="panel mb-m">
    <div class="ph">
      <div>
        <div class="title-m">あなたの動き方（CA支援）</div>
        <div class="sub" style="font-size:11.5px">上位CAとの行動の差分を示し、次に取るべき動きを提案します</div>
      </div>
      <div class="toolbar">
        ${CA_LIST.map(c=>`<button class="ftab ${c.id===sel?'on':''}" data-a="coach-sel" data-v="${c.id}">${esc(c.name)}</button>`).join('')}
      </div>
    </div>
    <div class="pb">
      <div class="exec-2col">
        <div>

/* 現在の「画面」を表すキー。これが同じ間の再描画はスクロール位置を維持し、
   画面が切り替わったときだけ先頭に戻す（v2.1: スクロールリセット不具合の修正） */
function viewKey(){
  return [state.mode, seekerView(), state.step, state.detailTab, state.caTab, state.myTab].join(':');
}
let _lastViewKey = null;

function render(){
  const active = document.activeElement;
  const keepId = active && active.id ? active.id : null;
  const keepPos = active && active.selectionStart != null ? active.selectionStart : null;

  const key = viewKey();
  const samePage = (key === _lastViewKey);
  const prevScroller = document.getElementById('pscroll');
  const keepScroll = samePage && prevScroller ? prevScroller.scrollTop : 0;
  const keepWin = samePage ? window.scrollY : 0;

  document.getElementById('app').innerHTML = appbarHtml() + stageHtml();
  _lastViewKey = key;
  bindApp();
  renderLayer();

  const scroller = document.getElementById('pscroll');
  if(scroller && keepScroll){
    // .phone-scroll は scroll-behavior:smooth のため、復元はアニメーションさせず即座に行う
    const prev = scroller.style.scrollBehavior;
    scroller.style.scrollBehavior = 'auto';
    scroller.scrollTop = keepScroll;
    scroller.style.scrollBehavior = prev;
  }
  if(keepWin) window.scrollTo({top:keepWin, left:0, behavior:'auto'});

  if(keepId){
    const el = document.getElementById(keepId);
    if(el && el.focus){ el.focus(); if(keepPos!=null && el.setSelectionRange){ try{el.setSelectionRange(keepPos,keepPos);}catch(e){} } }
  }
  if(state.mode==='seeker' && state.step==='swipe') bindDeck();
  save();
}

function chipsHtml(list, sel, action, max){

/* チップ群だけを描画する単位に切り出す（v2.1）。
   選択のたびに画面全体を作り直さないため、スクロール位置もフォーカスも失われない。 */
const CHIP_GROUPS = {
  stage:{list:CAREER_STAGES, multi:false, get:()=>state.profile.stage,  max:0},
  trait:{list:TRAITS,        multi:true,  get:()=>state.profile.traits, max:4},
  val:  {list:VALUES,        multi:true,  get:()=>state.profile.vals,   max:3},
  ind:  {list:INDUSTRIES,    multi:true,  get:()=>state.profile.inds,   max:0},
  loc:  {list:LOCATIONS,     multi:false, get:()=>state.profile.loc,    max:0}
};
function chipGroupHtml(action){
  const g = CHIP_GROUPS[action];
  if(!g) return '';
  if(g.multi) return chipsHtml(g.list, g.get(), action, g.max);
  const cur = g.get();
  return g.list.map(x=>`<button class="chip ${cur===x.k?'on':''}" data-a="${action}" data-v="${x.k}">${esc(x.l)}</button>`).join('');
}
function refreshChips(action){
  const host = document.getElementById('grp-'+action);
  if(!host){ render(); return; }              // プロフィール画面以外から呼ばれた場合の保険
  host.innerHTML = chipGroupHtml(action);
  const g = CHIP_GROUPS[action];
  const cnt = document.getElementById('cnt-'+action);
  if(cnt && g && g.max) cnt.textContent = '最大'+g.max+'つまで（'+g.get().length+'/'+g.max+'）';
  save();
}

function roiSlider(key, lab, min, max, step, unit){
  const v = state.roi[key];
  const disp = step<1 ? v.toFixed(1) : nfmt(v);
  return `
  <div class="roi-f">
    <label><span>${esc(lab)}</span><b>${disp}${esc(unit)}</b></label>
    <input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-roi="${key}">

}

function filteredCandidates(){
  const q = state.caQuery.trim();
  return allCandidates().filter(c=>{
    if(state.caFilter!=='all' && c.st!==state.caFilter) return false;
    if(q && c.name.indexOf(q)<0) return false;
    return true;
  });
}

  const raw = ((f.q||'') + '\n' + (f.a||'')).trim();

    <div class="mtags">${m.hits.map(h=>`<span class="mtag">${esc(h)}を伏せ字化</span>`).join('')}</div>
  </div>`;
}

function submitProfile(){

  // 職安法5条の5の収集禁止項目が自由記述に混ざっていないか。該当すれば保存しない。

function startAnalyze(){
  state.step='analyzing'; state.anStep=0; render();
  logActivity('プロフィールを登録');
  let i = 0;
  const tick = ()=>{
    i++;
    if(i < AN_STEPS.length){ state.anStep = i; render(); setTimeout(tick, 750); return; }
    state.scored = COMPANIES.map(c=>{
      const r = scoreCompany(c, state.profile);
      return Object.assign({}, c, {score:r.score, factors:r.factors});
    }).sort((a,b)=>b.score-a.score);
    state.idx = 0; state.liked = []; state.passed = []; state.history = [];
    state.step = 'report';
    logActivity('AI分析が完了（'+state.scored.length+'社を提示）');
    render();
  };
  setTimeout(tick, 850);
}

function commitSwipe(liked, isSuper){
  const c = state.scored[state.idx];
  if(!c) return;
  if(liked) state.liked.push(c.id); else state.passed.push(c.id);
  if(isSuper){
    state.superLiked = state.superLiked || [];
    state.superLiked.push(c.id);
    superLikeState().used++;
  }
  state.history.push({id:c.id, act:liked?'like':'pass', sup:!!isSuper});
  logActivity((isSuper?'★スーパーライク：':liked?'「興味あり」に登録：':'スキップ：')+c.name);
  state.idx++;
  if(state.idx >= state.scored.length){ state.step='liked'; render(); return; }
  redrawDeck();
}
function undoSwipe(){
  if(!state.history.length) return;
  const h = state.history.pop();
  const arr = h.act==='like' ? state.liked : state.passed;
  const i = arr.lastIndexOf(h.id);
  if(i>-1) arr.splice(i,1);
  if(h.sup){                                  // スーパーライクの取り消しは回数も返す
    const si = (state.superLiked||[]).lastIndexOf(h.id);
    if(si>-1) state.superLiked.splice(si,1);
    superLikeState().used = Math.max(0, superLikeState().used - 1);
  }
  state.idx = Math.max(0, state.idx-1);
  if(state.step!=='swipe'){ state.step='swipe'; render(); return; }
  redrawDeck();
  toast('ひとつ戻しました');
}
function redrawDeck(){
  const deck = document.getElementById('deck');
  if(!deck){ render(); return; }
  deck.innerHTML = deckInnerHtml();
  const head = document.querySelector('.deck-prog');
  if(head) head.innerHTML = '<b>'+Math.min(state.idx+1, state.scored.length)+'</b> / '+state.scored.length+' 社';
  const lk = document.querySelector('.deck-head .pill.ok');
  if(lk) lk.textContent = '興味あり '+state.liked.length;
  const ub = document.querySelector('[data-a="undo"]');
  if(ub) ub.disabled = state.history.length===0;
  // スーパーライクの残回数は .deck-actions 側にあるため、デッキ再描画時に併せて更新する
  const sb = document.querySelector('[data-a="super"]');
  if(sb) sb.disabled = !canSuperLike();
  const sl = document.querySelector('.super-left');
  if(sl) sl.textContent = '残り'+superLikeLeft();
  bindDeck();
  save();
}
function flyOut(dir, isSuper){
  const card = document.querySelector('.scard.top');
  if(!card){ commitSwipe(dir>0, isSuper); return; }
  card.style.transition = 'transform .28s cubic-bezier(.3,.1,.3,1), opacity .28s';
  card.style.transform = isSuper
    ? 'translateY(-620px) scale(.92)'
    : 'translate('+(dir*520)+'px,-30px) rotate('+(dir*26)+'deg)';
  card.style.opacity = '0';
  const sel = isSuper ? '[data-stamp="super"]' : (dir>0 ? '[data-stamp="like"]' : '[data-stamp="nope"]');
  const st = card.querySelector(sel);
  if(st) st.style.opacity = '1';
  setTimeout(()=>commitSwipe(dir>0, isSuper), 230);
}
function doSuperLike(){
  if(!canSuperLike()){ toast('スーパーライクは1日'+SUPER_LIKE_PER_DAY+'回までです'); return; }
  flyOut(1, true);
}

/* 面接ログの保存。CA登録・求職者投稿の両方がここを通る。
   順序が重要：
     1) 収集禁止項目の検査 → 該当したら保存しない（生データを一度も残さない）
     2) 個人特定情報のマスキング → 保存するのはマスク後のテキストだけ
   「保存してから表示時に隠す」設計にすると、DBに生の個人データが残り、
   漏えい時の被害と報告義務の範囲がそのまま広がる。 */
function saveLogEntry(src){
  const f = state.logForm || {};
  const coId = f.co || COMPANIES[0].id;
  const co = COMPANIES.find(c=>c.id===coId) || COMPANIES[0];
  const qs = (f.q||'').split('\n').map(s=>s.trim()).filter(Boolean).slice(0,6);
  const advice = (f.a||'').trim();

  if(!qs.length){ toast('聞かれた質問を1つ以上入力してください'); return; }
  if(src==='seeker' && !f.agree){ toast('共有への同意にチェックしてください'); return; }

  const ng = scanNgAll(qs.concat([advice]));
  if(ng.length){
    state.logNg = ng;
    renderLayer();
    toast('法令上、共有できない項目が含まれています');
    return;
  }
  state.logNg = [];

  // 提携企業の社名は落とさない。落とすと「どの企業のログか」が読めなくなる
  const m = maskAll(qs.concat([advice]), COMPANIES.map(c=>c.name));
  const maskedQs = m.texts.slice(0, qs.length);
  const maskedAdvice = m.texts[m.texts.length-1];

  const prev = state.extraLogs[coId] || [];
  const d = new Date();
  const log = {
    src,                                   // 'ca'（CAがヒアリングして登録）| 'seeker'（本人が投稿）
    mine: src==='seeker',
    cand: src==='seeker' ? '候補者（あなた）' : '候補者'+String.fromCharCode(70 + prev.length),
    round: f.rd || ROUNDS[0],
    interviewer: src==='seeker' ? '本人の記録' : 'CAヒアリング記録',
    minutes: parseInt(f.min, 10) || 40,
    when: d.getFullYear()+'年'+(d.getMonth()+1)+'月',
    atmosphere: (f.atm||'').trim() || (src==='seeker' ? '本人の主観による記録' : 'CAヒアリングに基づく記録'),
    qs: maskedQs.map(q=>({
      q,
      i: src==='seeker' ? '面接を受けた本人が投稿した質問です。' : 'CAが面接後にヒアリングした内容です。',
      p: ''
    })),
    pass: (f.rs||'pass')==='pass',
    advice: maskedAdvice || (src==='seeker' ? '本人からのコメントはありません。' : 'CAコメントの登録はありません。'),
    masked: m.hits
  };
  state.extraLogs[coId] = [log].concat(prev);
  logEvent('log_add', {
    actorRole: src==='seeker' ? 'seeker' : 'ca',
    applicationId: (src==='seeker' ? 'live#' : '') + coId,
    masked: m.hits.length
  });
  logActivity((src==='seeker' ? '面接ログを投稿：' : '面接ログを登録：') + co.name);

  state.modal = null;
  state.logForm = {};
  render();
  toast(m.hits.length
    ? co.name+'に投稿しました（'+m.hits.join('・')+'を伏せ字にしました）'
    : co.name+'に面接ログを投稿しました');
}
function saveLog(){ saveLogEntry('ca'); }
function saveSeekerLog(){ saveLogEntry('seeker'); }

/* 蓄積された実データの件数（サンプルを除く） */
function realLogCount(){
  return Object.keys(state.extraLogs||{}).reduce((n,k)=>n + state.extraLogs[k].length, 0);
}
function myLogCount(){
  return Object.keys(state.extraLogs||{}).reduce((n,k)=>n + state.extraLogs[k].filter(l=>l.mine).length, 0);
}
function hasMyLog(coId){ return (state.extraLogs[coId]||[]).some(l=>l.mine); }

function sendDm(){
  const txt = (state.dmDraft||'').trim();
  if(!txt){ toast('メッセージを入力してください'); return; }
  seedDm();
  state.dm.push({from:'me', t:nowHm(), text:txt});
  state.dmDraft = '';
  logActivity('担当CAにメッセージを送信');
  render();
  const th = document.querySelector('.dm-thread');

  toast('担当CAに送信しました（CA画面に未読として表示されます）');

/* CA側からの返信 */
function sendDmAsCa(candId){
  const txt = (state.caDmDraft||'').trim();
  if(!txt){ toast('メッセージを入力してください'); return; }
  dmThreadFor(candId).push({from:'ca', t:nowHm(), text:txt});

}

function loadDemoData(){
  const brand = state.brandName, client = state.clientName, view = state.seekerView;

  state.brandName = brand; state.clientName = client; state.seekerView = view;
  state.profile = {
    name:'山田 太郎', stage:'second',
    traits:['analy','init','logic','comm'],
    vals:['growth','auto','expert'],
    inds:['it','startup','consulting'],
    loc:'tokyo', payMin:550,
    pr:'SIerで3年間、業務システムの要件定義から運用まで担当しました。担当顧客の月次処理を自動化し、作業時間を月40時間削減した経験があります。'
  };
  state.scored = COMPANIES.map(c=>{
    const r = scoreCompany(c, state.profile);
    return Object.assign({}, c, {score:r.score, factors:r.factors});
  }).sort((a,b)=>b.score-a.score);

  // 上位を「興味あり」に、最上位をスーパーライクに
  const liked = state.scored.slice(0,5).map(c=>c.id);

  state.passed = state.scored.slice(5,9).map(c=>c.id);
  state.idx = 9;
  state.superLiked = [liked[0]];
  state.superLike = {date: todayKey(), used: 1};
  state.history = liked.map(id=>({id, act:'like', sup:id===liked[0]}));

  // 応募（＝企業への情報提供に同意）したのは上位4社だけにする。
  // 5社目は「興味はあるが未応募」のまま残し、企業ポータルで同意前がマスクされる挙動と、
  // 進捗タブの「応募する」ボタンを、商談の場でそのまま実演できるようにする。
  [0,1,2,3].forEach(i=>grantConsent(liked[i]));

  // 選考ステージを散らして、パイプラインが埋まった状態にする
  setStage(liked[0], 4);   // 内定
  setStage(liked[1], 3);   // 面接済み → 面接ログ投稿のCTAが出る状態
  setStage(liked[2], 2);
  setStage(liked[3], 1);

  // 内定済みの企業には、本人が投稿済みの面接ログを1件入れておく。
  // 「これから投稿する状態（liked[1]）」と「投稿済みの状態（liked[0]）」を並べて見せられる。
  state.extraLogs[liked[0]] = [{
    src:'seeker', mine:true, cand:'候補者（あなた）', round:'最終面接',
    interviewer:'本人の記録', minutes:45,
    when:new Date().getFullYear()+'年'+(new Date().getMonth()+1)+'月',

    qs:[
      {q:'これまでで一番の失敗と、そこから学んだことを教えてください', i:'面接を受けた本人が投稿した質問です。', p:''},
      {q:'入社後、最初の3か月で何を成果として出しますか', i:'面接を受けた本人が投稿した質問です。', p:''}
    ],
    pass:true,
    advice:'逆質問を3つ以上求められました。事業計画に踏み込んだ質問が刺さります。（学校名）出身であることには一切触れられませんでした。',
    masked:['学校名']

/* ============================================================================
   EVENT BINDING（委譲・1回だけ登録）
============================================================================ */
let bound = false;
function bindApp(){
  if(bound) return;
  bound = true;

  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-a]');
    if(!el) return;
    const a = el.dataset.a, v = el.dataset.v;
    switch(a){
      case 'mode':        state.mode=v; state.caOpen=null; state.raOpen=null; render(); break;
      case 'ra-sel':      state.raSel=v; state.raOpen=null; render(); break;
      case 'ra-open':     state.raOpen=v; renderLayer(); break;
      case 'ra-close':    state.raOpen=null; renderLayer(); break;
      case 'client-rate': {
        state.clientRatings = state.clientRatings || {};
        const appId = el.dataset.app, val = parseInt(v,10);
        state.clientRatings[appId] = state.clientRatings[appId]===val ? null : val;
        logEvent('rate', {actorRole:'client', applicationId:appId, value:state.clientRatings[appId]});
        render();
        toast(['見送り','保留','通過'][val-1]+'として記録しました（CA・RAに共有されます）');
        break;
      }
      case 'client-slot': {
        const appId = el.dataset.app;
        logEvent('meeting', {actorRole:'client', applicationId:appId});
        toast('日程候補を担当CAに送信しました');
        break;
      }
      case 'reset':       resetAll(); break;
      case 'demo-data':   loadDemoData(); break;
      case 'settings':    state.modal='settings'; renderLayer(); break;
      case 'close-modal': state.modal=null; renderLayer(); break;
      case 'tour':        state.tour = state.tour<0 ? 0 : -1; renderLayer(); break;
      case 'tour-next':   state.tour = state.tour>=TOUR.length-1 ? -1 : state.tour+1; renderLayer(); break;
      case 'tour-prev':   state.tour = Math.max(0, state.tour-1); renderLayer(); break;
      case 'tour-skip':   state.tour = -1; renderLayer(); break;

      case 'go-profile':  goProfile(); break;
      case 'edit-profile':state.step='profile'; render(); break;
      case 'stage':       state.profile.stage=v; refreshChips('stage'); break;
      case 'trait':       if(!toggleIn(state.profile.traits,v,4)) toast('選べるのは4つまでです'); refreshChips('trait'); break;
      case 'val':         if(!toggleIn(state.profile.vals,v,3)) toast('選べるのは3つまでです'); refreshChips('val'); break;
      case 'ind':         toggleIn(state.profile.inds,v,0); refreshChips('ind'); break;
      case 'loc':         state.profile.loc=v; refreshChips('loc'); break;
      case 'submit-profile': submitProfile(); break;

      case 'go-swipe':    state.step='swipe'; render(); scrollTop(); break;
      case 'go-swipe-again': state.idx=0; state.liked=[]; state.passed=[]; state.history=[]; state.step='swipe'; render(); scrollTop(); break;
      case 'like':        flyOut(1); break;
      case 'pass':        flyOut(-1); break;
      case 'super':       doSuperLike(); break;
      case 'undo':        undoSwipe(); break;
      case 'nav':         goNav(v); break;
      case 'mytab':       state.myTab=v; render(); break;
      case 'dm-send':     sendDm(); break;
      case 'stage-up':    setStage(v, stageOf(v)+1); render(); toast(STAGES[stageOf(v)]+'に更新しました'); break;
      case 'stage-dn':    setStage(v, stageOf(v)-1); render(); break;
      case 'skip-to-liked': state.step='liked'; render(); scrollTop(); break;

      case 'detail':      openDetail(v); break;
      case 'dtab':        state.detailTab=v; render(); break;
      case 'back-liked':  state.step='liked'; render(); scrollTop(); break;
      case 'go-schedule': state.schedId=v; state.slot=null; state.step='schedule'; render(); scrollTop(); break;
      case 'slot':        state.slot={day:el.dataset.day, time:el.dataset.time}; render(); break;
      case 'confirm-slot':confirmSlot(); break;

      case 'sales-view':  state.caSalesView=v; render(); break;
      case 'sales-ca':    state.caSalesSel=v; state.caSalesView='ca'; render(); break;
      case 'coach-sel':   state.caCoachSel=v; render(); break;
      case 'ca-tab':      state.caTab=v; render(); break;
      case 'ca-filter':   state.caFilter=v; render(); break;
      case 'ca-open':     state.caOpen=v; state.caDrawerTab = dmUnreadFor(v) ? 'dm' : 'ai';
                          if(state.caDrawerTab==='dm') markDmRead(v);
                          renderLayer(); break;
      case 'close-drawer':state.caOpen=null; render(); break;   // 未読バッジを一覧に反映するため全体を再描画
      case 'dr-tab':      state.caDrawerTab=v; if(v==='dm' && state.caOpen) markDmRead(state.caOpen); renderLayer(); break;
      case 'ca-dm-send':  sendDmAsCa(v); break;
      case 'ca-dm-quick': state.caDmDraft=v; renderLayer();
                          { const i=document.getElementById('ca-dm-input'); if(i){i.focus();} } break;
      case 'add-log':     state.modal='log'; state.logNg=[];
                          state.logForm=state.logForm||{co:COMPANIES[0].id, rd:ROUNDS[0], rs:'pass'}; renderLayer(); break;
      case 'save-log':    saveLog(); break;

      /* ---- v1.3: 応募＝同意 ---- */
      case 'open-consent': state.consentId=v; state.consentAgree=false; state.modal='consent'; renderLayer(); break;
      case 'do-apply':    doApply(v); break;
      case 'revoke-consent': doRevoke(v); break;

      /* ---- v1.3: 求職者による面接ログ投稿 ---- */
      case 'open-seeker-log':
        state.modal='seeker-log'; state.logNg=[];
        state.logForm={co:v, rd:ROUNDS[0], rs:'pass', min:'40', atm:ATMOSPHERES[0], agree:false};
        renderLayer(); break;
      case 'save-seeker-log': saveSeekerLog(); break;
      case 'delete-my-log':   deleteMyLog(v); break;

      /* ---- v1.3: 表示切替（スマホ / PC） ---- */
      case 'seeker-view': state.seekerView = v; render(); break;
    }
  });

  document.addEventListener('input', e=>{
    const t = e.target;
    if(t.dataset.model){
      const k = t.dataset.model;
      if(k==='name' || k==='pr'){
        state.profile[k] = t.value;
        if(k==='pr'){
          // 入力のたびに検査する。画面全体は作り直さない（カーソル位置を失うため）
          const box = document.getElementById('pr-ng');
          if(box) box.innerHTML = prNgLiveHtml(t.value);
        }
      }
      else if(k==='caQuery'){ state.caQuery = t.value; renderCaTableOnly(); }
      else { state[k] = t.value; if(k==='brandName'||k==='clientName') updateBrandOnly(); }
      save();
      return;
    }
    if(t.dataset.range==='pay'){
      state.profile.payMin = parseInt(t.value,10);
      const el = document.getElementById('pay-val');
      if(el) el.textContent = state.profile.payMin+'万円 〜';
      save();
      return;
    }
    if(t.dataset.roi){
      const k = t.dataset.roi;
      state.roi[k] = parseFloat(t.value);
      renderRoiOnly();
      save();
      return;
    }
    // 面接ログの入力：打つそばから「共有される姿」を更新する
    if(t.dataset.logform){
      state.logForm = state.logForm||{};
      state.logForm[t.dataset.logform] = t.value;
      const prev = document.getElementById('mask-prev');
      if(prev) prev.innerHTML = maskPreviewHtml(state.logForm);
      save();
      return;
    }
  });
  document.addEventListener('change', e=>{
    const t = e.target;
    if(t.dataset.logform){ state.logForm = state.logForm||{}; state.logForm[t.dataset.logform] = t.value; }
    if(t.dataset.logformCheck){
      state.logForm = state.logForm||{};
      state.logForm[t.dataset.logformCheck] = t.checked;
    }
    if(t.dataset.consentCheck){
      // 同意ボタンの活性を切り替えるため、モーダルだけ描き直す
      state.consentAgree = t.checked;
      renderLayer();
    }
  });

  document.addEventListener('keydown', e=>{
    if(state.tour>=0 && (e.key==='ArrowRight'||e.key==='ArrowLeft')){
      if(e.key==='ArrowRight'){ state.tour = state.tour>=TOUR.length-1 ? -1 : state.tour+1; }
      else { state.tour = Math.max(0,state.tour-1); }
      renderLayer(); return;
    }
    if(e.key==='Escape'){
      if(state.modal){ state.modal=null; renderLayer(); return; }
      if(state.caOpen){ state.caOpen=null; renderLayer(); return; }
      if(state.tour>=0){ state.tour=-1; renderLayer(); return; }
    }
    if(state.mode!=='seeker' || state.step!=='swipe' || state.modal) return;
    const tag = (e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select') return;
    if(e.key==='ArrowRight'){ e.preventDefault(); flyOut(1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); flyOut(-1); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); doSuperLike(); }
    else if(e.key.toLowerCase()==='z'){ e.preventDefault(); undoSwipe(); }
  });
}

/* ============================================================================
   SWIPE DRAG
============================================================================ */
function bindDeck(){
  const card = document.querySelector('.scard.top');
  if(!card || card.dataset.bound) return;
  card.dataset.bound = '1';

  const like = card.querySelector('[data-stamp="like"]');
  const nope = card.querySelector('[data-stamp="nope"]');
  const body = card.querySelector('.body');
  let dragging=false, sx=0, sy=0, dx=0, dy=0, raf=0, fromBody=false;

  const paint = ()=>{
    raf = 0;
    card.style.transform = 'translate('+dx+'px,'+dy+'px) rotate('+(dx/16)+'deg)';
    const a = Math.min(Math.abs(dx)/90, 1);
    like.style.opacity = dx > 14 ? a : 0;
    nope.style.opacity = dx < -14 ? a : 0;
  };
  const move = (x,y)=>{
    dx = x - sx; dy = y - sy;
    if(!raf) raf = requestAnimationFrame(paint);
  };
  const end = ()=>{
    if(!dragging) return;
    dragging = false;
    window.removeEventListener('pointermove', pm);
    window.removeEventListener('pointerup', pu);
    window.removeEventListener('pointercancel', pu);
    if(Math.abs(dx) > 95){ flyOut(dx>0 ? 1 : -1); return; }
    card.style.transition = 'transform .25s cubic-bezier(.2,1.2,.4,1)';
    card.style.transform = 'translate(0,0) rotate(0)';
    like.style.opacity = 0; nope.style.opacity = 0;
  };
  const pm = e=>{
    if(!dragging) return;
    if(fromBody && Math.abs(e.clientX-sx) < 12 && Math.abs(e.clientY-sy) < 12) return;
    fromBody = false;
    move(e.clientX, e.clientY);
  };
  const pu = ()=>end();

  card.addEventListener('pointerdown', e=>{
    if(e.button && e.button!==0) return;
    // カード内スクロール中は縦方向を優先させる
    fromBody = !!(body && body.contains(e.target) && body.scrollHeight > body.clientHeight);
    dragging = true; sx = e.clientX; sy = e.clientY; dx = 0; dy = 0;
    card.style.transition = 'none';
    window.addEventListener('pointermove', pm);
    window.addEventListener('pointerup', pu);
    window.addEventListener('pointercancel', pu);
  });
}
