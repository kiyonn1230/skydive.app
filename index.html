<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SwipeCA｜人材紹介会社向け AIマッチングSaaS 営業デモ</title>
<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root{
  --brand:#4f46e5; --brand-600:#4338ca; --brand-700:#3730a3;
  --brand-50:#eef2ff; --brand-100:#e0e7ff; --brand-300:#a5b4fc;
  --ok:#059669; --ok-bg:#ecfdf5; --ok-line:#a7f3d0;
  --warn:#d97706; --warn-bg:#fffbeb; --warn-line:#fde68a;
  --danger:#e11d48; --danger-bg:#fff1f2; --danger-line:#fecdd3;
  --info:#0284c7; --info-bg:#f0f9ff;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --line2:#f1f5f9;
  --bg:#eef1f6; --surface:#fff; --surface2:#f8fafc;
  --r-xs:6px; --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:28px;
  --sh1:0 1px 2px rgba(15,23,42,.05);
  --sh2:0 4px 14px rgba(15,23,42,.08);
  --sh3:0 14px 36px rgba(15,23,42,.14);
  --sh4:0 30px 70px rgba(15,23,42,.24);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:14px; line-height:1.6;
}
button,input,textarea,select{font-family:inherit;}
button{cursor:pointer;}
h1,h2,h3,h4{margin:0; line-height:1.35; letter-spacing:.01em;}
p{margin:0;}
ul,ol{margin:0;}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:4px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:#94a3b8;background-clip:content-box;}

/* ============================================================
   APP BAR
============================================================ */
.appbar{
  position:sticky; top:0; z-index:60;
  background:rgba(255,255,255,.86); backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
  padding:10px 18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand .logo{
  width:36px;height:36px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(140deg,var(--brand),#818cf8 60%,#c4b5fd);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;
  box-shadow:0 4px 12px rgba(79,70,229,.35);
}
.brand .bname{font-weight:900;font-size:17px;color:var(--brand-700);letter-spacing:.02em;white-space:nowrap;}
.brand .btag{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;}
.spacer{flex:1;}
.segmented{display:flex;background:var(--line2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
.segmented button{
  border:none;background:transparent;padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:800;
  color:var(--muted);transition:.15s;white-space:nowrap;
}
.segmented button.on{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(79,70,229,.35);}
.segmented button:not(.on):hover{color:var(--ink);}
.icon-btn{
  border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px;font-weight:700;
  padding:8px 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;transition:.15s;white-space:nowrap;
}
.icon-btn:hover{background:var(--surface2);color:var(--ink);border-color:#cbd5e1;}
.icon-btn.danger:hover{background:var(--danger-bg);border-color:var(--danger-line);color:var(--danger);}
.demo-flag{
  font-size:10.5px;font-weight:800;color:#92400e;background:#fef3c7;border:1px solid var(--warn-line);
  padding:4px 9px;border-radius:999px;white-space:nowrap;
}

/* ============================================================
   STAGE / PHONE FRAME
============================================================ */
.stage{padding:26px 16px 80px;display:flex;justify-content:center;}
.stage.ca{padding:24px 20px 80px;}
.wrap{width:100%;max-width:1180px;}

.phone-outer{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;}
.phone{width:100%;max-width:430px;}
.phone-scroll{padding-bottom:20px;}
@media (min-width:960px){
  .phone{
    border:11px solid #111827; border-radius:44px; background:#fff; overflow:hidden;
    box-shadow:var(--sh4); height:min(820px, calc(100vh - 150px)); position:relative;
  }
  .phone::before{
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:132px; height:24px; background:#111827; border-radius:0 0 16px 16px; z-index:40;
  }
  .phone-scroll{height:100%;overflow-y:auto;overflow-x:hidden;padding:34px 0 24px;scroll-behavior:smooth;}
}
.pad{padding:0 20px;}

/* ============================================================
   PRIMITIVES
============================================================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);}
.card.pad-l{padding:22px;}
.title-xl{font-size:24px;font-weight:900;letter-spacing:-.01em;}
.title-l{font-size:19px;font-weight:900;}
.title-m{font-size:15.5px;font-weight:800;}
.sub{color:var(--muted);font-size:12.5px;line-height:1.75;}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--brand);text-transform:uppercase;}
.divider{height:1px;background:var(--line);margin:18px 0;}
.mt-s{margin-top:8px}.mt-m{margin-top:16px}.mt-l{margin-top:26px}
.mb-s{margin-bottom:8px}.mb-m{margin-bottom:16px}.mb-l{margin-bottom:26px}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.wrapf{flex-wrap:wrap;}
.grow{flex:1;min-width:0;}
.tnum{font-variant-numeric:tabular-nums;}

.btn{
  border:none;border-radius:12px;padding:13px 22px;font-size:14.5px;font-weight:800;
  transition:transform .08s, box-shadow .15s, background .15s; display:inline-flex;
  align-items:center;justify-content:center;gap:8px;
}
.btn:active:not(:disabled){transform:scale(.985);}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.p{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(79,70,229,.3);}
.btn.p:hover:not(:disabled){background:var(--brand-600);}
.btn.s{background:#fff;color:var(--brand-700);border:1.5px solid var(--brand-100);}
.btn.s:hover{background:var(--brand-50);}
.btn.g{background:#fff;color:var(--muted);border:1px solid var(--line);}
.btn.g:hover{background:var(--surface2);color:var(--ink);}
.btn.block{width:100%;}
.btn.sm{padding:9px 14px;font-size:12.5px;border-radius:10px;}
.link-btn{background:none;border:none;color:var(--muted);font-size:13px;font-weight:700;padding:6px 0;display:inline-flex;align-items:center;gap:5px;}
.link-btn:hover{color:var(--brand);}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap;}
.pill.gray{background:var(--line2);color:var(--muted);}
.pill.brand{background:var(--brand-50);color:var(--brand-700);}
.pill.ok{background:var(--ok-bg);color:var(--ok);}
.pill.warn{background:var(--warn-bg);color:var(--warn);}
.pill.danger{background:var(--danger-bg);color:var(--danger);}
.pill.info{background:var(--info-bg);color:var(--info);}

.avatar{
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:900;flex-shrink:0;letter-spacing:.02em;
}
.avatar.s{width:38px;height:38px;font-size:14px;border-radius:11px;}
.avatar.m{width:48px;height:48px;font-size:18px;}
.avatar.l{width:60px;height:60px;font-size:23px;border-radius:16px;}

.note{border-radius:var(--r-sm);padding:11px 13px;font-size:12px;line-height:1.7;}
.note.info{background:var(--info-bg);color:#075985;border-left:3px solid var(--info);}
.note.warn{background:var(--warn-bg);color:#78350f;border-left:3px solid var(--warn);}
.note.brand{background:var(--brand-50);color:var(--brand-700);border-left:3px solid var(--brand);}
.note.gray{background:var(--surface2);color:var(--muted);border:1px solid var(--line);}

/* ============================================================
   FORM
============================================================ */
.field{margin-bottom:22px;}
.field > label{display:flex;align-items:baseline;gap:7px;font-size:13px;font-weight:800;margin-bottom:9px;}
.field .hint{font-weight:600;color:var(--faint);font-size:11px;}
.req{color:var(--danger);font-size:10px;font-weight:900;}
.input,.ta{
  width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;
  outline:none;transition:.15s;background:#fff;color:var(--ink);
}
.input:focus,.ta:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-50);}
.ta{resize:vertical;min-height:86px;line-height:1.7;font-size:13.5px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;
  font-size:12.5px;font-weight:700;color:var(--ink2);transition:.12s;position:relative;
}
.chip:hover:not(.on){border-color:var(--brand-300);color:var(--brand-700);}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(79,70,229,.28);}
.chip.on::before{content:'✓ ';font-weight:900;}
.chip:disabled{opacity:.4;cursor:not-allowed;}
.range-row{display:flex;align-items:center;gap:14px;}
input[type=range]{flex:1;accent-color:var(--brand);height:4px;}
.range-val{font-weight:900;color:var(--brand-700);font-size:14px;min-width:92px;text-align:right;}
.err{
  color:#9f1239;font-size:12.5px;font-weight:700;background:var(--danger-bg);
  border:1px solid var(--danger-line);padding:10px 13px;border-radius:10px;margin-bottom:16px;
}
.steps{display:flex;gap:6px;margin-bottom:20px;}
.steps .s{flex:1;height:4px;border-radius:99px;background:var(--line);}
.steps .s.on{background:var(--brand);}

/* ============================================================
   LANDING
============================================================ */
.landing{text-align:center;padding:34px 0 30px;}
.landing .hero{
  width:84px;height:84px;border-radius:26px;margin:0 auto 20px;
  background:linear-gradient(140deg,var(--brand),#a78bfa);
  display:flex;align-items:center;justify-content:center;font-size:38px;
  box-shadow:0 16px 32px rgba(79,70,229,.3);
}
.landing h1{font-size:25px;margin-bottom:12px;letter-spacing:-.02em;}
.landing .lead{color:var(--muted);font-size:13.5px;line-height:1.85;margin-bottom:24px;}
.feat-list{text-align:left;display:flex;flex-direction:column;gap:10px;margin:22px 0 26px;}
.feat{display:flex;gap:11px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.feat .ico{width:28px;height:28px;border-radius:9px;background:var(--brand-50);color:var(--brand-700);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.feat .t{font-size:12.5px;font-weight:800;margin-bottom:2px;}
.feat .d{font-size:11.5px;color:var(--muted);line-height:1.6;}

/* ============================================================
   ANALYZING
============================================================ */
.analyzing{padding:56px 0;text-align:center;}
.orb{
  width:92px;height:92px;margin:0 auto 26px;border-radius:50%;position:relative;
  background:conic-gradient(from 0deg,var(--brand),#a78bfa,#f0abfc,var(--brand));
  animation:spin 1.4s linear infinite; display:flex;align-items:center;justify-content:center;
}
.orb::after{content:'';position:absolute;inset:7px;border-radius:50%;background:#fff;}
.orb span{position:relative;z-index:2;font-size:30px;}
@keyframes spin{to{transform:rotate(360deg);}}
.an-steps{margin-top:24px;text-align:left;display:flex;flex-direction:column;gap:11px;}
.an-step{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--faint);transition:.3s;font-weight:700;}
.an-step .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;transition:.3s;}
.an-step.act{color:var(--ink);}
.an-step.act .dot{border-color:var(--brand);animation:pulse 1s ease-in-out infinite;}
.an-step.done{color:var(--muted);}
.an-step.done .dot{background:var(--ok);border-color:var(--ok);}
.an-step.done .dot::after{content:'✓';}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,.4);}50%{box-shadow:0 0 0 6px rgba(79,70,229,0);}}

/* ============================================================
   AI REPORT
============================================================ */
.persona{
  background:linear-gradient(140deg,var(--brand-700),var(--brand) 55%,#8b5cf6);
  border-radius:var(--r-lg);padding:22px;color:#fff;box-shadow:0 14px 30px rgba(79,70,229,.3);
}
.persona .kicker{font-size:10.5px;font-weight:900;letter-spacing:.14em;opacity:.75;}
.persona .ptype{font-size:22px;font-weight:900;margin:7px 0 9px;letter-spacing:-.01em;}
.persona .pdesc{font-size:12.5px;line-height:1.8;opacity:.94;}
.persona .ptags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
.persona .ptags span{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;}
.sec-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900;margin:24px 0 12px;}
.sec-head .bar{width:3px;height:15px;background:var(--brand);border-radius:2px;}
.ai-item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:#fff;}
.ai-item .h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin-bottom:6px;}
.ai-item .n{width:20px;height:20px;border-radius:6px;background:var(--brand-50);color:var(--brand-700);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;}
.ai-item .b{font-size:12px;color:var(--ink2);line-height:1.75;}
.ai-item.growth .n{background:var(--warn-bg);color:var(--warn);}
.ai-item .act{margin-top:8px;font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:8px 10px;border-radius:8px;line-height:1.65;font-weight:700;}
.bars{display:flex;flex-direction:column;gap:9px;}
.bar-row{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:10px;font-size:11.5px;}
.bar-row .lab{font-weight:800;color:var(--ink2);}
.bar-track{height:7px;background:var(--line2);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#818cf8);transition:width .7s cubic-bezier(.2,.8,.2,1);}
.bar-row .v{font-weight:900;color:var(--brand-700);text-align:right;font-variant-numeric:tabular-nums;}

/* ============================================================
   SWIPE DECK
============================================================ */
.deck-head{display:flex;align-items:center;justify-content:space-between;padding:0 20px 10px;}
.deck-prog{font-size:11.5px;font-weight:800;color:var(--muted);}
.deck-prog b{color:var(--brand-700);font-size:14px;}
.deck-area{position:relative;padding:0 16px;}
.deck{position:relative;width:100%;height:min(520px,58vh);}
@media(min-width:960px){.deck{height:clamp(330px, calc(100vh - 420px), 500px);}}
.scard{
  position:absolute;inset:0;background:#fff;border-radius:22px;border:1px solid var(--line);
  box-shadow:var(--sh3);display:flex;flex-direction:column;overflow:hidden;
  user-select:none;-webkit-user-select:none;touch-action:pan-y;will-change:transform;
}
.scard.top{cursor:grab;}
.scard.top:active{cursor:grabbing;}
.scard .hero{height:104px;position:relative;display:flex;align-items:center;padding:0 18px;gap:13px;}
.scard .hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.16));}
.scard .hero .avatar{background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.4);position:relative;z-index:2;}
.scard .hero .hname{position:relative;z-index:2;color:#fff;font-weight:900;font-size:15.5px;line-height:1.35;text-shadow:0 1px 4px rgba(0,0,0,.3);}
.scard .hero .hsub{position:relative;z-index:2;color:rgba(255,255,255,.9);font-size:11px;font-weight:700;margin-top:2px;}
.score-badge{
  position:absolute;top:12px;right:12px;z-index:3;background:rgba(255,255,255,.95);
  border-radius:12px;padding:6px 10px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.15);
}
.score-badge .n{font-size:18px;font-weight:900;color:var(--brand-700);line-height:1;font-variant-numeric:tabular-nums;}
.score-badge .l{font-size:8.5px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin-top:2px;}
.stamp{
  position:absolute;top:30px;z-index:5;font-size:24px;font-weight:900;padding:5px 14px;
  border:4px solid;border-radius:10px;opacity:0;pointer-events:none;letter-spacing:.06em;
}
.stamp.like{left:20px;color:var(--ok);border-color:var(--ok);transform:rotate(-16deg);}
.stamp.nope{right:20px;color:var(--danger);border-color:var(--danger);transform:rotate(16deg);}
.scard .body{padding:15px 18px 18px;flex:1;overflow-y:auto;}
.mrow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.desc{font-size:12.5px;color:var(--ink2);line-height:1.75;margin-bottom:13px;}
.why{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:11px;padding:11px 13px;margin-bottom:13px;}
.why .wt{font-size:10.5px;font-weight:900;color:var(--brand-700);letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:5px;}
.why .wb{font-size:11.5px;color:var(--brand-700);line-height:1.7;font-weight:600;}
.ctags{display:flex;flex-wrap:wrap;gap:5px;}
.ctag{font-size:10.5px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);padding:4px 9px;border-radius:7px;font-weight:700;}
.deck-actions{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:18px;}
.rbtn{
  border-radius:50%;border:2px solid;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--sh2);transition:transform .1s, box-shadow .15s;
}
.rbtn:hover{transform:translateY(-2px);box-shadow:var(--sh3);}
.rbtn:active{transform:scale(.9);}
.rbtn.big{width:62px;height:62px;font-size:25px;}
.rbtn.sml{width:46px;height:46px;font-size:17px;}
.rbtn.nope{color:var(--danger);border-color:var(--danger-line);}
.rbtn.like{color:var(--ok);border-color:var(--ok-line);}
.rbtn.undo{color:var(--warn);border-color:var(--warn-line);}
.rbtn.info{color:var(--info);border-color:#bae6fd;}
.rbtn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
.deck-hint{font-size:11px;color:var(--faint);text-align:center;margin-top:12px;line-height:1.7;}
.kbd{display:inline-block;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;font-size:10px;font-weight:800;color:var(--muted);}

/* ============================================================
   LISTS / DETAIL
============================================================ */
.celebrate{text-align:center;padding:6px 0 18px;}
.celebrate .em{font-size:36px;}
.crow{
  display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:10px;width:100%;text-align:left;transition:.15s;
}
.crow:hover{border-color:var(--brand-300);box-shadow:var(--sh2);transform:translateY(-1px);}
.crow .nm{font-weight:800;font-size:13.5px;margin-bottom:3px;}
.crow .sb{font-size:11px;color:var(--muted);}
.crow .arr{color:var(--faint);font-size:16px;flex-shrink:0;}
.empty{text-align:center;padding:44px 4px;color:var(--muted);}
.empty .ei{font-size:40px;margin-bottom:14px;}

.dhead{display:flex;gap:13px;align-items:flex-start;margin-bottom:18px;}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px;}
.sbox{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 8px;text-align:center;}
.sbox .n{font-size:19px;font-weight:900;color:var(--brand-700);font-variant-numeric:tabular-nums;}
.sbox .l{font-size:10px;color:var(--muted);margin-top:3px;font-weight:700;}
.tabs{display:flex;gap:4px;background:var(--line2);padding:4px;border-radius:12px;margin-bottom:16px;}
.tabs button{flex:1;border:none;background:transparent;padding:9px 6px;border-radius:9px;font-size:12px;font-weight:800;color:var(--muted);transition:.15s;}
.tabs button.on{background:#fff;color:var(--brand-700);box-shadow:var(--sh1);}
.log{border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:11px;background:#fff;}
.log .lt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.log .lc{font-size:12.5px;font-weight:900;}
.log .lm{font-size:10.5px;color:var(--muted);margin-top:2px;}
.qh{font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.06em;margin:12px 0 7px;}
.q{border-left:2px solid var(--brand-100);padding:0 0 0 11px;margin-bottom:11px;}
.q .qt{font-size:12.5px;font-weight:700;line-height:1.65;margin-bottom:4px;}
.q .qi{font-size:11px;color:var(--muted);line-height:1.65;}
.q .qi b{color:var(--brand-700);}
.advice{background:var(--warn-bg);border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:11.5px;color:#78350f;line-height:1.7;margin-top:10px;}
.prep-q{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;}
.prep-q .pq{font-size:12.5px;font-weight:800;line-height:1.6;margin-bottom:8px;}
.star{display:flex;flex-direction:column;gap:5px;}
.star div{font-size:11.5px;color:var(--ink2);line-height:1.6;}
.star b{display:inline-block;min-width:78px;color:var(--brand-700);font-weight:900;font-size:10.5px;}
.sticky-cta{position:sticky;bottom:0;background:linear-gradient(to top,#fff 62%,rgba(255,255,255,0));padding:18px 0 4px;margin-top:14px;}

/* ============================================================
   SCHEDULE
============================================================ */
.ca-box{display:flex;align-items:center;gap:12px;background:var(--brand-50);border:1px solid var(--brand-100);border-radius:14px;padding:13px 15px;margin-bottom:20px;}
.slot-day{margin-bottom:15px;}
.slot-day .dl{font-size:11.5px;font-weight:900;color:var(--ink2);margin-bottom:8px;}
.slot-opts{display:flex;gap:7px;flex-wrap:wrap;}
.slot{padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:12.5px;font-weight:800;color:var(--ink2);transition:.12s;}
.slot:hover:not(.on):not(:disabled){border-color:var(--brand-300);}
.slot.on{background:var(--brand);border-color:var(--brand);color:#fff;}
.slot:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through;}
.success{text-align:center;padding:14px 4px;}
.success .si{
  width:66px;height:66px;border-radius:50%;background:var(--ok-bg);color:var(--ok);font-size:31px;
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:pop .45s cubic-bezier(.2,1.4,.4,1);
}
@keyframes pop{0%{transform:scale(0);}100%{transform:scale(1);}}
.summary{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:15px;text-align:left;margin:18px 0;font-size:12.5px;}
.summary .sr{display:flex;gap:10px;padding:6px 0;}
.summary .sk{color:var(--muted);font-weight:800;min-width:76px;flex-shrink:0;}
.summary .sv{font-weight:700;}


/* ============================================================
   CA CONSOLE
============================================================ */
.ca-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:18px;}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 13px;box-shadow:var(--sh1);position:relative;overflow:hidden;}
.kpi .n{font-size:23px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15;}
.kpi .l{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:800;}
.kpi .d{font-size:10px;font-weight:800;margin-top:5px;}
.kpi.alert{background:linear-gradient(180deg,#fff7ed,#fff);border-color:var(--warn-line);}
.kpi .strip{position:absolute;left:0;top:0;bottom:0;width:3px;}

.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh1);overflow:hidden;}
.panel > .ph{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--surface2);}
.panel > .pb{padding:18px;}

.roi{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:22px;}
@media(max-width:900px){.roi{grid-template-columns:1fr;}}
.roi-in{display:flex;flex-direction:column;gap:15px;}
.roi-f label{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;margin-bottom:6px;}
.roi-f label b{color:var(--brand-700);font-variant-numeric:tabular-nums;}
.roi-out{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start;}
.roi-card{border-radius:14px;padding:16px;border:1px solid var(--line);background:var(--surface2);}
.roi-card .rl{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:6px;}
.roi-card .rn{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15;}
.roi-card .rn small{font-size:13px;font-weight:800;margin-left:2px;}
.roi-card .rs{font-size:10.5px;color:var(--faint);margin-top:5px;line-height:1.55;}
.roi-card.hi{background:linear-gradient(140deg,var(--brand-700),var(--brand));border:none;color:#fff;box-shadow:0 10px 26px rgba(79,70,229,.28);}
.roi-card.hi .rl{color:rgba(255,255,255,.78);}
.roi-card.hi .rs{color:rgba(255,255,255,.7);}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.ftab{padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:11.5px;font-weight:800;color:var(--muted);transition:.12s;}
.ftab:hover:not(.on){border-color:var(--brand-300);color:var(--brand-700);}
.ftab.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.search{position:relative;}
.search input{padding:8px 12px 8px 32px;border:1.5px solid var(--line);border-radius:10px;font-size:12.5px;outline:none;width:190px;}
.search input:focus{border-color:var(--brand);}
.search .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--faint);}

#ca-listhost{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.tbl{width:100%;border-collapse:collapse;min-width:340px;}
table.tbl th{
  text-align:left;font-size:10.5px;font-weight:900;color:var(--muted);letter-spacing:.05em;
  padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap;
}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:middle;}
table.tbl tr.tr-row{transition:.1s;}
table.tbl tr.tr-row:hover{background:#fafbff;}
table.tbl tr.tr-row.live{background:#fffdf3;}
table.tbl tr.tr-row.live:hover{background:#fffbe8;}
.tname{display:flex;align-items:center;gap:10px;}
.tname .nm{font-weight:800;font-size:13px;display:flex;align-items:center;gap:6px;}
.tname .sb{font-size:10.5px;color:var(--muted);margin-top:1px;}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--danger);animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
.mini-bar{width:64px;height:5px;background:var(--line2);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;}
.mini-bar i{display:block;height:100%;background:var(--brand);border-radius:99px;}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
@media(max-width:900px){.kanban{grid-template-columns:repeat(2,minmax(0,1fr));}}
@media(max-width:560px){.kanban{grid-template-columns:1fr;}}
.kcol{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:11px;min-height:180px;}
.kcol .kh{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:900;margin-bottom:10px;padding:0 3px;}
.kcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--sh1);width:100%;text-align:left;transition:.12s;}
.kcard:hover{border-color:var(--brand-300);box-shadow:var(--sh2);transform:translateY(-1px);}
.kcard .kn{font-weight:800;font-size:12.5px;display:flex;align-items:center;gap:6px;}
.kcard .km{font-size:10.5px;color:var(--muted);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;}

.todo{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);}
.todo:last-child{border-bottom:none;}
.todo .ti{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.todo .tt{font-size:12.5px;font-weight:800;}
.todo .td{font-size:11px;color:var(--muted);margin-top:2px;}

/* ============================================================
   DRAWER / MODAL / TOUR / TOAST
============================================================ */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;backdrop-filter:blur(2px);animation:fade .2s;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:101;
  box-shadow:var(--sh4);display:flex;flex-direction:column;animation:slidein .26s cubic-bezier(.2,.8,.2,1);
}
@keyframes slidein{from{transform:translateX(100%);}to{transform:translateX(0);}}
.drawer .dh{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:13px;}
.drawer .dbody{flex:1;overflow-y:auto;padding:18px 20px 34px;}
.close-x{border:none;background:var(--line2);width:30px;height:30px;border-radius:9px;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.close-x:hover{background:var(--line);color:var(--ink);}

.modal-box{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:101;background:#fff;
  border-radius:18px;width:min(560px,calc(100% - 32px));max-height:calc(100vh - 64px);overflow-y:auto;
  box-shadow:var(--sh4);padding:24px;animation:pop2 .22s cubic-bezier(.2,1.2,.4,1);
}
@keyframes pop2{from{transform:translate(-50%,-46%) scale(.96);opacity:0;}to{transform:translate(-50%,-50%) scale(1);opacity:1;}}

.tour{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:120;width:min(600px,calc(100% - 28px));
  background:var(--ink);color:#fff;border-radius:16px;padding:16px 18px;box-shadow:var(--sh4);
  display:flex;gap:14px;align-items:flex-start;
}
.tour .tn{width:30px;height:30px;border-radius:9px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;}
.tour .tt{font-size:13.5px;font-weight:900;margin-bottom:4px;}
.tour .tb{font-size:12px;line-height:1.7;color:#cbd5e1;}
.tour .tacts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap;}
.tour button{border:none;border-radius:9px;padding:7px 13px;font-size:11.5px;font-weight:800;}
.tour .tprev{background:#334155;color:#e2e8f0;}
.tour .tnext{background:#fff;color:var(--ink);}
.tour .tskip{background:transparent;color:#94a3b8;}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:130;
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13px;font-weight:700;
  box-shadow:var(--sh3);animation:up .25s cubic-bezier(.2,.9,.3,1);
}
@keyframes up{from{transform:translate(-50%,14px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}

.timeline{position:relative;padding-left:20px;}
.timeline::before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--line);}
.tl{position:relative;padding-bottom:15px;}
.tl::before{content:'';position:absolute;left:-19px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--brand-300);}
.tl.now::before{background:var(--brand);border-color:var(--brand);}
.tl .tlt{font-size:12.5px;font-weight:800;}
.tl .tld{font-size:10.5px;color:var(--muted);margin-top:2px;}

@media(max-width:1080px){.kpis{grid-template-columns:repeat(3,1fr);}}
@media(max-width:620px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .roi-out{grid-template-columns:1fr;}
  .appbar{padding:10px 12px;}
  .brand .btag{display:none;}
  .stage.ca{padding:16px 12px 70px;}
  table.tbl .hide-sm{display:none;}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ============================================================================
   v1.1 EDITORIAL LAYER
   方針：均質な角丸＋インディゴ＋グラデーションという「汎用AI出力の見た目」を排し、
        墨・朱・生成の3色、明朝見出し、罫線主体の誌面的レイアウトに寄せる。
   既存のクラス名・構造は変更せず、トークンと形状のみを上書きする。
============================================================================ */
:root{
  /* --- 色：墨 / 朱 / 生成 --- */
  --sumi:#14110F;      /* 墨 */
  --shu:#C8503C;       /* 朱 */
  --kinari:#F5F1E8;    /* 生成 */

  --brand:#C8503C; --brand-600:#B3452F; --brand-700:#8F3625;
  --brand-50:#FAF0ED; --brand-100:#F0DAD4; --brand-300:#DDA294;

  --ok:#3F6B4F; --ok-bg:#EDF3EE; --ok-line:#C3D6C9;
  --warn:#8A6B2F; --warn-bg:#F7F1E2; --warn-line:#E0CFA6;
  --danger:#A83A2C; --danger-bg:#F8ECE9; --danger-line:#E6C4BC;
  --info:#2F4858; --info-bg:#EDF1F4;

  --ink:#14110F; --ink2:#3D3733; --muted:#736A63; --faint:#A29A92;
  --line:#DED7CA; --line2:#EDE8DD;
  --bg:#F5F1E8; --surface:#FFFDF8; --surface2:#F9F5EC;

  /* --- 形状：角丸は「機能で使い分ける」。均質な角丸をやめる --- */
  --r-xs:2px; --r-sm:3px; --r:4px; --r-lg:6px; --r-xl:8px;
  --r-pill:999px;

  /* --- 影：誌面的に、影ではなく罫線で構造を作る --- */
  --sh1:none;
  --sh2:0 1px 0 var(--line);
  --sh3:0 10px 30px rgba(20,17,15,.10);
  --sh4:0 24px 60px rgba(20,17,15,.22);

  --mincho:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","Noto Serif JP","MS PMincho",serif;
}

body{ background:var(--bg); color:var(--ink); font-size:14px; line-height:1.9; }

/* ---------- タイポグラフィ：見出しは明朝、字間を開ける ---------- */
h1,h2,h3,h4,
.title-xl,.title-l,.title-m,
.landing h1,.persona .ptype,.celebrate h2{
  font-family:var(--mincho);
  font-weight:600;
  letter-spacing:.06em;
  line-height:1.5;
}
.title-xl{font-size:27px;}
.title-l{font-size:20px;}
.title-m{font-size:15px;letter-spacing:.04em;}
.landing h1{font-size:30px;line-height:1.55;}
.sub{line-height:1.95;color:var(--muted);}
.eyebrow{
  font-family:var(--mincho); font-size:10.5px; font-weight:600;
  letter-spacing:.32em; color:var(--shu); text-transform:none;
}
/* 数字は明朝にすると誌面感が出る */
.kpi .n,.roi-card .rn,.sbox .n,.score-badge .n,.stat3 .n,.rank-badge .rk{
  font-family:var(--mincho); font-weight:600; letter-spacing:.02em;
}

/* ---------- 罫線主体の構造 ---------- */
.card,.panel{border:1px solid var(--line);border-radius:var(--r);box-shadow:none;background:var(--surface);}
.panel > .ph{background:transparent;border-bottom:1px solid var(--line);}
.sec-head{
  font-family:var(--mincho); font-size:13px; letter-spacing:.1em; font-weight:600;
  border-bottom:1px solid var(--line); padding-bottom:9px; margin:28px 0 14px;
}
.sec-head .bar{width:2px;height:13px;background:var(--shu);border-radius:0;}
.divider{background:var(--line);}

/* ---------- ボタン：角丸を極端に使い分ける（対比を作る） ---------- */
.btn{border-radius:var(--r-pill);font-weight:700;letter-spacing:.08em;padding:14px 26px;}
.btn.p{background:var(--shu);color:#fff;box-shadow:none;}
.btn.p:hover:not(:disabled){background:var(--brand-600);}
.btn.s{background:transparent;color:var(--shu);border:1px solid var(--shu);}
.btn.s:hover{background:var(--brand-50);}
.btn.g{background:transparent;color:var(--ink2);border:1px solid var(--line);}
.btn.g:hover{background:var(--surface2);border-color:var(--ink2);}
.btn.sm{padding:8px 16px;letter-spacing:.05em;}
.icon-btn{border-radius:var(--r-pill);letter-spacing:.04em;background:transparent;}
.link-btn{letter-spacing:.05em;}
.link-btn:hover{color:var(--shu);}

/* ---------- アプリバー ---------- */
.appbar{
  background:rgba(245,241,232,.9); border-bottom:1px solid var(--ink);
  backdrop-filter:saturate(140%) blur(12px);
}
.brand .logo{
  background:var(--sumi); border-radius:0; box-shadow:none;
  font-family:var(--mincho); font-weight:600; font-size:19px; color:var(--kinari);
}
.brand .bname{
  font-family:var(--mincho); color:var(--sumi); font-weight:600;
  letter-spacing:.14em; font-size:17px;
}
.brand .btag{letter-spacing:.06em;color:var(--muted);}
.segmented{background:transparent;border:1px solid var(--line);border-radius:var(--r-pill);}
.segmented button{letter-spacing:.06em;}
.segmented button.on{background:var(--sumi);color:var(--kinari);box-shadow:none;}
.demo-flag{
  background:transparent;border:1px solid var(--warn-line);color:var(--warn);
  border-radius:0;letter-spacing:.1em;
}

/* ---------- フォーム ---------- */
.input,.ta{
  border-radius:0; border:none; border-bottom:1px solid var(--line);
  background:transparent; padding:11px 2px; font-size:15px;
}
.input:focus,.ta:focus{border-color:var(--shu);box-shadow:none;}
.ta{border:1px solid var(--line);padding:12px 13px;border-radius:var(--r);}
.ta:focus{border-color:var(--shu);}
.field > label{letter-spacing:.08em;font-size:12px;font-weight:700;}
.field .hint{letter-spacing:.02em;}
.req{color:var(--shu);letter-spacing:.06em;}
.chip{
  border-radius:var(--r-pill); border:1px solid var(--line); background:transparent;
  letter-spacing:.04em; font-weight:600; padding:8px 15px;
}
.chip:hover:not(.on):not(:disabled){border-color:var(--shu);color:var(--shu);background:transparent;}
.chip.on{background:var(--sumi);border-color:var(--sumi);color:var(--kinari);box-shadow:none;}
.chip.on::before{content:'';}
.steps .s{height:2px;border-radius:0;background:var(--line);}
.steps .s.on{background:var(--shu);}
.err{border-radius:0;border:none;border-left:2px solid var(--danger);background:var(--danger-bg);}
input[type=range]{accent-color:var(--shu);}
.range-val{font-family:var(--mincho);color:var(--sumi);font-weight:600;}

/* ---------- ピル・注記 ---------- */
.pill{border-radius:var(--r-pill);letter-spacing:.06em;font-weight:700;}
.pill.gray{background:transparent;border:1px solid var(--line);color:var(--muted);}
.pill.brand{background:var(--brand-50);color:var(--brand-700);}
.note{border-radius:0;line-height:1.85;}
.note.info{background:var(--info-bg);border-left:2px solid var(--info);color:#2F4858;}
.note.warn{background:var(--warn-bg);border-left:2px solid var(--warn);color:#5C4718;}
.note.brand{background:var(--brand-50);border-left:2px solid var(--shu);color:var(--brand-700);}
.note.gray{background:transparent;border:1px solid var(--line);color:var(--muted);}

/* ---------- ランディング ---------- */
.landing .hero{
  background:var(--sumi); border-radius:0; box-shadow:none;
  width:72px; height:72px; font-size:30px;
}
.landing .lead{line-height:2;color:var(--muted);}
.feat{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;padding:14px 2px;}
.feat:last-child{border-bottom:1px solid var(--line);}
.feat .ico{background:transparent;border:1px solid var(--line);border-radius:0;color:var(--shu);}
.feat .t{letter-spacing:.05em;}

/* ---------- 解析中 ---------- */
.orb{background:conic-gradient(from 0deg,var(--sumi),var(--shu),var(--sumi));}
.orb::after{background:var(--bg);}
.an-step .dot{border-radius:0;border-color:var(--line);}
.an-step.act .dot{border-color:var(--shu);}
.an-step.done .dot{background:var(--sumi);border-color:var(--sumi);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,80,60,.35);}50%{box-shadow:0 0 0 6px rgba(200,80,60,0);}}

/* ---------- AI分析レポート ---------- */
.persona{
  background:var(--sumi); border-radius:var(--r); box-shadow:none;
  border-left:3px solid var(--shu); padding:24px 22px;
}
.persona .kicker{letter-spacing:.3em;color:var(--shu);opacity:1;font-family:var(--mincho);}
.persona .ptype{font-size:23px;letter-spacing:.08em;color:var(--kinari);}
.persona .pdesc{color:#CFC8BF;line-height:2;}
.persona .ptags span{background:transparent;border:1px solid rgba(245,241,232,.3);color:#CFC8BF;border-radius:var(--r-pill);}
.ai-item{border:none;border-top:1px solid var(--line);border-radius:0;padding:15px 2px;}
.ai-item .n{border-radius:0;background:transparent;border:1px solid var(--shu);color:var(--shu);font-family:var(--mincho);}
.ai-item.growth .n{border-color:var(--warn);color:var(--warn);background:transparent;}
.ai-item .h{letter-spacing:.05em;}
.ai-item .act{border-radius:0;background:var(--warn-bg);}
.bar-track{background:var(--line2);border-radius:0;height:5px;}
.bar-fill{background:var(--shu);border-radius:0;}
.bar-row .v{font-family:var(--mincho);color:var(--sumi);}

/* ---------- スワイプカード ---------- */
.scard{border-radius:var(--r);border:1px solid var(--ink);box-shadow:var(--sh3);background:var(--surface);}
.scard .hero::after{background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.22));}
.scard .hero .hname{font-family:var(--mincho);letter-spacing:.07em;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.35);}
.scard .hero .hsub{letter-spacing:.05em;}
.score-badge{border-radius:0;background:var(--kinari);box-shadow:none;border:1px solid var(--ink);}
.score-badge .l{letter-spacing:.1em;color:var(--muted);}
.stamp{border-radius:0;font-family:var(--mincho);letter-spacing:.1em;border-width:2px;}
.why{background:transparent;border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;}
.why .wt{letter-spacing:.12em;color:var(--shu);}
.why .wb{color:var(--ink2);}
.ctag{background:transparent;border:1px solid var(--line);border-radius:0;letter-spacing:.03em;}
.meta-pill,.mrow .pill{border-radius:var(--r-pill);}
.rbtn{border-radius:50%;box-shadow:none;border-width:1px;}
.rbtn.nope{border-color:var(--danger);color:var(--danger);background:var(--surface);}
.rbtn.like{border-color:var(--ok);color:var(--ok);background:var(--surface);}
.rbtn.undo{border-color:var(--warn);color:var(--warn);background:var(--surface);}
.rbtn.info{border-color:var(--info);color:var(--info);background:var(--surface);}
.rbtn:hover{box-shadow:var(--sh2);}
.kbd{border-radius:2px;background:transparent;}
.deck-prog b{font-family:var(--mincho);color:var(--sumi);}

/* ---------- リスト・詳細 ---------- */
.crow{border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:15px 2px;}
.crow:hover{background:var(--surface2);border-color:var(--ink2);transform:none;box-shadow:none;}
.crow .nm{letter-spacing:.05em;font-family:var(--mincho);font-size:14.5px;}
.sbox{background:transparent;border:none;border-right:1px solid var(--line);border-radius:0;}
.stat3 .sbox:last-child{border-right:none;}
.sbox .n{color:var(--sumi);}
.sbox .l{letter-spacing:.06em;}
.tabs{background:transparent;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:0;}
.tabs button{
  border-radius:0;background:transparent;padding:11px 4px;letter-spacing:.06em;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button.on{background:transparent;color:var(--sumi);border-bottom-color:var(--shu);box-shadow:none;}
.log{border:none;border-top:1px solid var(--line);border-radius:0;padding:16px 2px;background:transparent;}
.log .lc{font-family:var(--mincho);letter-spacing:.05em;font-size:13.5px;}
.q{border-left:1px solid var(--shu);padding-left:13px;}
.advice{border-radius:0;border-left:2px solid var(--warn);}
.prep-q{background:transparent;border:none;border-top:1px solid var(--line);border-radius:0;padding:15px 2px;}
.prep-q .pq{font-family:var(--mincho);letter-spacing:.04em;font-size:13.5px;}
.star b{font-family:var(--mincho);color:var(--shu);letter-spacing:.06em;}
.summary{background:transparent;border:1px solid var(--line);border-radius:0;}
.summary .sk{letter-spacing:.08em;}
.sticky-cta{background:linear-gradient(to top,var(--surface) 62%,rgba(255,253,248,0));}

/* ---------- 予約 ---------- */
.ca-box{background:transparent;border:none;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);border-radius:0;padding:15px 2px;}
.slot{border-radius:0;border:1px solid var(--line);letter-spacing:.04em;background:transparent;}
.slot:hover:not(.on):not(:disabled){border-color:var(--shu);color:var(--shu);}
.slot.on{background:var(--sumi);border-color:var(--sumi);color:var(--kinari);}
.slot-day .dl{font-family:var(--mincho);letter-spacing:.08em;}
.success .si{background:transparent;border:1px solid var(--ok);color:var(--ok);border-radius:50%;}

/* ---------- CAコンソール ---------- */
.kpi{border:1px solid var(--line);border-radius:var(--r);box-shadow:none;background:var(--surface);}
.kpi .strip{width:2px;}
.kpi .n{color:var(--sumi);font-size:25px;}
.kpi .l{letter-spacing:.07em;}
.kpi.alert{background:var(--warn-bg);border-color:var(--warn-line);}
.roi-card{border-radius:var(--r);border:1px solid var(--line);background:transparent;}
.roi-card .rl{letter-spacing:.07em;}
.roi-card .rn{font-size:29px;color:var(--sumi);}
.roi-card.hi{background:var(--sumi);border:1px solid var(--sumi);box-shadow:none;}
.roi-card.hi .rn{color:var(--kinari);}
.roi-card.hi .rl{color:var(--shu);}
.roi-card.hi .rs{color:#A29A92;}
.roi-f label{letter-spacing:.05em;}
.roi-f label b{font-family:var(--mincho);color:var(--shu);}
.ftab{border-radius:var(--r-pill);border-color:var(--line);background:transparent;letter-spacing:.05em;}
.ftab.on{background:var(--sumi);border-color:var(--sumi);}
.search input{border-radius:var(--r-pill);border-color:var(--line);background:transparent;}
.search input:focus{border-color:var(--shu);}
table.tbl th{
  background:transparent;border-bottom:1px solid var(--ink);
  letter-spacing:.1em;color:var(--ink2);font-weight:700;
}
table.tbl td{border-bottom:1px solid var(--line2);}
table.tbl tr.tr-row:hover{background:var(--surface2);}
table.tbl tr.tr-row.live{background:#FBF3E9;}
table.tbl tr.tr-row.live:hover{background:#F7EDDF;}
.tname .nm{font-family:var(--mincho);letter-spacing:.04em;font-size:13.5px;}
.mini-bar{background:var(--line2);border-radius:0;}
.mini-bar i{background:var(--shu);border-radius:0;}
.live-dot{background:var(--shu);}
.kcol{background:transparent;border:1px solid var(--line);border-radius:var(--r);}
.kcol .kh{font-family:var(--mincho);letter-spacing:.08em;border-bottom:1px solid var(--line);padding-bottom:8px;}
.kcard{border-radius:var(--r);box-shadow:none;border-color:var(--line);background:var(--surface);}
.kcard:hover{border-color:var(--ink2);box-shadow:none;transform:none;}
.kcard .kn{font-family:var(--mincho);letter-spacing:.04em;}
.todo .ti{border-radius:0;}
.todo .tt{letter-spacing:.04em;}

/* ---------- オーバーレイ ---------- */
.scrim{background:rgba(20,17,15,.55);}
.drawer{background:var(--surface);border-left:1px solid var(--ink);}
.drawer .dh{border-bottom:1px solid var(--ink);}
.modal-box{border-radius:var(--r);border:1px solid var(--ink);background:var(--surface);}
.close-x{border-radius:0;background:transparent;border:1px solid var(--line);}
.close-x:hover{background:var(--sumi);color:var(--kinari);border-color:var(--sumi);}
.tour{background:var(--sumi);border-radius:var(--r);border-left:3px solid var(--shu);}
.tour .tn{background:var(--shu);border-radius:0;font-family:var(--mincho);}
.tour .tt{font-family:var(--mincho);letter-spacing:.07em;}
.tour .tb{color:#BDB5AC;line-height:1.9;}
.tour button{border-radius:var(--r-pill);letter-spacing:.05em;}
.tour .tprev{background:#3D3733;color:#CFC8BF;}
.tour .tnext{background:var(--kinari);color:var(--sumi);}
.toast{background:var(--sumi);border-radius:var(--r-pill);letter-spacing:.05em;}
.timeline::before{background:var(--line);}
.tl::before{border-radius:0;border-color:var(--shu);background:var(--surface);}
.tl.now::before{background:var(--shu);}
.tl .tlt{letter-spacing:.04em;}
.avatar{border-radius:var(--r-xs);letter-spacing:.04em;}
.avatar.circle{border-radius:50%;}

/* ---------- スマホ枠：機種っぽさを消し、紙のような見え方に ---------- */
@media (min-width:960px){
  .phone{border:1px solid var(--ink);border-radius:var(--r);box-shadow:var(--sh3);}
  .phone::before{display:none;}
  .phone-scroll{padding:26px 0 24px;}
}


/* ---------- v1.1 / 2. マッチランク ---------- */
.rank-badge{
  position:absolute;top:12px;right:12px;z-index:3;background:var(--kinari);
  border:1px solid var(--ink);padding:7px 11px 6px;text-align:center;min-width:60px;
}
.rank-badge .rk{font-size:26px;line-height:1;color:var(--sumi);letter-spacing:.04em;}
.rank-badge .rl{font-size:8.5px;font-weight:800;color:var(--muted);letter-spacing:.1em;margin-top:3px;}
.rank-badge .rn{font-family:var(--mincho);margin-left:3px;color:var(--sumi);}
.rank-badge.ss{background:var(--sumi);}
.rank-badge.ss .rk{color:#E8C36A;}
.rank-badge.ss .rl{color:#A29A92;}
.rank-badge.ss .rn{color:#E8C36A;}
.rank-badge.s .rk{color:var(--shu);}
.rank-badge.b,.rank-badge.c{opacity:.9;}
.rank-badge.c .rk{color:var(--muted);}

.rank-pill{
  display:inline-flex;align-items:baseline;gap:4px;font-family:var(--mincho);font-weight:600;
  font-size:14px;letter-spacing:.06em;color:var(--sumi);border:1px solid var(--ink);
  padding:2px 9px;line-height:1.5;
}
.rank-pill i{font-style:normal;font-size:10px;font-family:var(--font);font-weight:700;color:var(--muted);}
.rank-pill.ss{background:var(--sumi);color:#E8C36A;border-color:var(--sumi);}
.rank-pill.ss i{color:#A29A92;}
.rank-pill.s{color:var(--shu);border-color:var(--shu);}
.rank-pill.c{color:var(--muted);border-color:var(--line);}
.rank-legend{display:flex;gap:5px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);}
.rank-legend b{font-family:var(--mincho);color:var(--sumi);}

/* ---------- v1.1 / 3. ワークスタイル・タイプ ---------- */
.wtype{border:1px solid var(--ink);padding:18px 17px;background:var(--surface);}
.wt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px;}
.wt-kicker{font-family:var(--mincho);font-size:10px;letter-spacing:.26em;color:var(--shu);}
.wt-name{font-family:var(--mincho);font-size:21px;letter-spacing:.08em;margin-top:5px;color:var(--sumi);}
.wt-code{
  font-family:var(--mincho);font-size:19px;letter-spacing:.16em;color:var(--kinari);
  background:var(--sumi);padding:6px 11px;flex-shrink:0;
}
.wt-axes{display:flex;flex-direction:column;gap:10px;margin-bottom:15px;}
.wt-ax{display:grid;grid-template-columns:62px 1fr 62px;align-items:center;gap:9px;font-size:10.5px;}
.wt-ax-l{text-align:right;color:var(--faint);font-weight:700;}
.wt-ax-r{text-align:left;color:var(--faint);font-weight:700;}
.wt-ax-l.on,.wt-ax-r.on{color:var(--sumi);}
.wt-ax-bar{position:relative;height:1px;background:var(--line);}
.wt-ax-bar i{position:absolute;top:-4px;width:9px;height:9px;background:var(--shu);transform:translateX(-50%) rotate(45deg);}
.wt-lines{margin:0;padding-left:16px;font-size:11.5px;color:var(--ink2);line-height:1.85;}
.wt-lines li{margin-bottom:2px;}
.wt-note{font-size:10.5px;color:var(--faint);line-height:1.7;margin-top:12px;border-top:1px solid var(--line2);padding-top:9px;}

/* ---------- v1.1 / 5. 幾何学アバター ---------- */
.av{display:inline-block;flex-shrink:0;overflow:hidden;line-height:0;background:var(--line2);}
.av-svg{display:block;width:100%;height:100%;}
.av-person{border-radius:50%;}
.av-co{border-radius:2px;}
.av-ring{box-shadow:0 0 0 1px var(--line);}
.scard .hero .av{box-shadow:0 0 0 1px rgba(245,241,232,.45);}


/* ---------- v1.1 / 4. スーパーライク ---------- */
.rbtn.super{border-color:#B8912F;color:#B8912F;background:var(--surface);}
.rbtn.super:disabled{border-color:var(--line);color:var(--faint);}
.super-left{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-align:center;margin-top:5px;}
.stamp.super{
  left:50%;top:18px;transform:translateX(-50%) rotate(-6deg);
  color:#B8912F;border-color:#B8912F;
}
.pill.super{background:var(--sumi);color:#E8C36A;}

/* ---------- v1.1 / 6. ボトムナビ ---------- */
.botnav{
  position:sticky;bottom:0;z-index:30;display:flex;
  background:rgba(245,241,232,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--ink);margin-top:26px;
}
.botnav .bn{
  flex:1;border:none;background:transparent;padding:11px 4px 12px;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;color:var(--faint);
}
.botnav .bn-ic{font-size:16px;line-height:1;}
.botnav .bn-l{font-size:10px;font-weight:800;letter-spacing:.08em;}
.botnav .bn.on{color:var(--sumi);}
.botnav .bn.on::before{content:'';position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--shu);}
.botnav .bn-badge{
  position:absolute;top:6px;left:calc(50% + 9px);background:var(--shu);color:#fff;
  font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ---------- v1.1 / 8. マイページ ---------- */
.my-head{display:flex;gap:14px;align-items:center;padding:6px 0 20px;border-bottom:1px solid var(--ink);}
.my-type{
  display:inline-block;font-family:var(--mincho);font-size:11.5px;letter-spacing:.1em;
  border:1px solid var(--line);padding:3px 10px;color:var(--ink2);
}
.dash{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);}
.dash-c{padding:16px 6px;text-align:center;border-right:1px solid var(--line);}
.dash-c:last-child{border-right:none;}
.dash-n{font-family:var(--mincho);font-size:26px;font-weight:600;color:var(--sumi);line-height:1;}
.dash-l{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.06em;margin-top:6px;}
.next-mtg{display:flex;gap:12px;align-items:center;padding:15px 2px;border-bottom:1px solid var(--line);}
.next-mtg .nm-k{
  font-family:var(--mincho);font-size:10px;letter-spacing:.2em;color:var(--shu);
  writing-mode:vertical-rl;text-orientation:upright;
}
.next-mtg .nm-d{font-family:var(--mincho);font-size:17px;letter-spacing:.06em;color:var(--sumi);}
.next-mtg .nm-s{font-size:11px;color:var(--muted);margin-top:3px;}

/* ---------- v1.1 / 9. DM ---------- */
.dm-head{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);}
.dm-thread{padding:16px 0;display:flex;flex-direction:column;gap:14px;}
.dm-row{display:flex;gap:8px;align-items:flex-end;}
.dm-row.me{flex-direction:row-reverse;}
.dm-b{max-width:78%;}
.dm-t{
  font-size:12.5px;line-height:1.8;padding:10px 13px;background:var(--surface);
  border:1px solid var(--line);border-radius:2px 12px 12px 12px;color:var(--ink2);
}
.dm-row.me .dm-t{background:var(--sumi);color:var(--kinari);border-color:var(--sumi);border-radius:12px 2px 12px 12px;}
.dm-time{font-size:9.5px;color:var(--faint);margin-top:4px;}
.dm-row.me .dm-time{text-align:right;}
.dm-input{display:flex;gap:9px;align-items:center;border-top:1px solid var(--line);padding-top:13px;}
.dm-input .input{flex:1;}

/* ---------- v1.1 / 10. 内定リスト・注力リスト ---------- */
.two-col{display:grid;grid-template-columns:1fr;gap:22px;}
.tc-h{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mincho);font-size:13px;letter-spacing:.12em;color:var(--sumi);
  border-bottom:1px solid var(--ink);padding-bottom:8px;margin-bottom:4px;
}
.tc-h b{font-size:10.5px;font-family:var(--font);letter-spacing:.06em;color:var(--muted);font-weight:800;}
.tc-empty{font-size:11.5px;color:var(--faint);line-height:1.85;padding:16px 2px;}
.prow{display:flex;gap:11px;align-items:flex-start;padding:14px 2px;border-bottom:1px solid var(--line2);}
.prank{
  font-family:var(--mincho);font-size:19px;color:var(--faint);min-width:22px;text-align:center;
  line-height:1.2;flex-shrink:0;
}
.prank.top{color:var(--shu);}
.pnm{font-family:var(--mincho);font-size:13.5px;letter-spacing:.04em;color:var(--sumi);margin-bottom:6px;}
.pmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
.pstage{
  font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 9px;
  border:1px solid var(--line);color:var(--muted);
}
.pstage.s2{border-color:var(--warn);color:var(--warn);}
.pstage.s3{border-color:var(--info);color:var(--info);}
.pstage.s4{background:var(--sumi);border-color:var(--sumi);color:#E8C36A;}
.pbar{height:2px;background:var(--line2);position:relative;}
.pbar i{display:block;height:100%;background:var(--shu);transition:width .35s cubic-bezier(.2,.8,.2,1);}
.pfocus{font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:.04em;}
.pfocus b{font-family:var(--mincho);color:var(--sumi);font-size:12px;}
.pacts{display:flex;flex-direction:column;gap:4px;flex-shrink:0;}
.pbtn{
  width:26px;height:22px;border:1px solid var(--line);background:transparent;
  font-size:9px;color:var(--muted);line-height:1;
}
.pbtn:hover:not(:disabled){border-color:var(--shu);color:var(--shu);}
.pbtn:disabled{opacity:.3;cursor:not-allowed;}
@media(min-width:960px){ .two-col{grid-template-columns:1fr;} }


/* ---------- v1.1 / 11-12. 売上達成率 ---------- */
.sales-sel{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;}
.ca-chip{
  display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;
  padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.04em;
}
.ca-chip:hover:not(.on){border-color:var(--shu);}
.ca-chip.on{background:var(--sumi);border-color:var(--sumi);color:var(--kinari);}
.ca-chip i{font-style:normal;font-family:var(--mincho);font-size:12.5px;}
.ca-chip i.ok{color:#3F6B4F;} .ca-chip i.warn{color:#8A6B2F;} .ca-chip i.bad{color:#A83A2C;}
.ca-chip.on i.ok{color:#8FC5A2;} .ca-chip.on i.warn{color:#E0BE78;} .ca-chip.on i.bad{color:#E8A296;}

.sales-grid{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center;margin-bottom:18px;}
@media(max-width:760px){.sales-grid{grid-template-columns:1fr;gap:16px;}}
.sales-donut{text-align:center;border-right:1px solid var(--line);padding-right:16px;}
@media(max-width:760px){.sales-donut{border-right:none;border-bottom:1px solid var(--line);padding:0 0 16px;}}
.sales-donut .sd-l{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--muted);margin-top:8px;}
.sales-donut .sd-s{font-size:11px;color:var(--faint);margin-top:4px;font-variant-numeric:tabular-nums;}
.sales-donut .sd-f{font-size:11px;color:var(--muted);margin-top:8px;border-top:1px solid var(--line2);padding-top:8px;}
.sales-donut .sd-f b{font-family:var(--mincho);font-size:14px;}
.sales-chart{min-width:0;}
.ch-legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-top:6px;}
.ch-legend .lg{width:9px;height:9px;display:inline-block;margin-left:8px;}

    if(o && o.profile) state = Object.assign(blankState(), o);
    migrate();
  }catch(e){}
}
/* v1.2以前に保存された状態の移行。
   v1.2では「興味あり＝応募中」で、同意という概念そのものが無かった。
   v1.3では同意記録がなければ企業に情報が渡らないため、旧データをそのまま読むと
   すべて「応募検討」に見える。当時の意味で応募が進んでいた企業（進捗や面談予約が
   入っている企業）は、同意済みとして引き継ぐ。 */
function migrate(){
  if(!state.liked || !state.liked.length) return;
  state.consents = state.consents || {};
  if(Object.keys(state.consents).length) return;      // v1.3以降のデータは触らない
  const at = new Date().toISOString();
  state.liked.forEach(id=>{
    const advanced = (state.progress && state.progress[id] != null) || (state.schedules && state.schedules[id]);
    if(advanced) state.consents[id] = {at, ver:CONSENT_VER, scope:CONSENT_SCOPE.slice(), migrated:true};
  });
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ let a=seed>>>0; return function(){ a+=0x6D2B79F5; let t=a; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; }; }
function pick(arr, r){ return arr[Math.floor(r()*arr.length)]; }
function label(list, k){ const f=list.find(x=>x.k===k); return f?f.l:k; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function nfmt(n){ return Math.round(n).toLocaleString('ja-JP'); }
function todayStr(){ const d=new Date(); return (d.getMonth()+1)+'/'+d.getDate(); }
function daysAgoStr(d){ if(d===0) return 'たった今'; if(d===1) return '1日前'; return d+'日前'; }

function toast(msg){

/* --- 1. 収集禁止項目の検知 ------------------------------------------------
   保存を止めるための検査。誤検知より取りこぼしのほうが事故が重いため、
   広めに拾って「該当箇所を人が消す」運用に倒している。
   本番ではサーバー側でも同じ検査を通す（クライアントの検査は迂回できるため）。 */
const NG_RULES = [
  {k:'honseki', l:'本籍・出生地・門地', why:'職業安定法5条の5：社会的差別の原因となるおそれのある事項',
   re:/本籍|出生地|門地|出身地|実家は|生まれ育っ/},
  {k:'race',    l:'人種・民族', why:'職業安定法5条の5：社会的差別の原因となるおそれのある事項',
   re:/人種|民族|帰化/},
  {k:'creed',   l:'思想・信条・宗教・支持政党', why:'職業安定法5条の5：思想および信条',
   re:/思想信条|信条|宗教|信仰|宗派|支持政党|政治信条/},
  {k:'union',   l:'労働組合への加入状況', why:'職業安定法5条の5：労働組合への加入状況',
   re:/労働組合|労組|ユニオンに(加入|所属)/},
  {k:'family',  l:'家族構成・家庭環境', why:'指針（平11労告141号）：本人に責任のない事項',
   re:/家族構成|両親は|父親は|母親は|父は|母は|兄弟は|世帯収入|生活保護|母子家庭|父子家庭/},
  {k:'health',  l:'病歴・通院歴', why:'個人情報保護法2条3項：要配慮個人情報',
   re:/病歴|持病|通院|入院歴|うつ病|障害者手帳|服薬|診断書/},
  {k:'crime',   l:'犯罪歴', why:'個人情報保護法2条3項：要配慮個人情報',
   re:/前科|犯罪歴|逮捕歴/}
];
function scanNg(text){
  const s = String(text == null ? '' : text);
  if(!s.trim()) return [];
  const out = [];
  NG_RULES.forEach(r=>{
    const m = s.match(r.re);
    if(m) out.push({k:r.k, l:r.l, why:r.why, hit:m[0]});
  });
  return out;
}
/* 複数フィールドをまとめて検査する */
function scanNgAll(fields){
  const seen = {}, out = [];
  fields.filter(Boolean).forEach(t=>{
    scanNg(t).forEach(h=>{ if(!seen[h.k]){ seen[h.k]=1; out.push(h); } });
  });
  return out;
}
function ngErrHtml(hits){
  if(!hits.length) return '';
  return `<div class="err ng-err">
    <b>⚠ 法令上、収集できない項目が含まれています</b>

        <span class="ng-hit">「${esc(h.hit)}」</span>
        <span class="ng-lab">${esc(h.l)}</span>

  </div>`;
}
const NG_NOTICE = '本籍・出生地・家族構成・思想信条・宗教・支持政党・労働組合への加入状況・病歴は、法令により収集できません。入力された場合は保存されません。';

/* --- 2. 共有前のマスキング ------------------------------------------------
   面接ログは他の候補者に見せる＝第三者提供にあたるため、個人を識別できる記述を
   保存の時点で落とす。表示時ではなく保存時に落とすのは、生データを残さないため。
   keep には「落としてはいけない語」（対象企業名など）を渡す。 */
const MASK_RULES = [
  {k:'mail',   l:'メールアドレス', re:/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, to:'（メールアドレス）'},
  {k:'tel',    l:'電話番号',       re:/0\d{1,4}[-‐ ]?\d{1,4}[-‐ ]?\d{3,4}/g,             to:'（電話番号）'},
  {k:'url',    l:'URL',            re:/https?:\/\/[^\s、。）]+/g,                          to:'（URL）'},
  {k:'school', l:'学校名',         re:/[一-龥ぁ-んァ-ヶーA-Za-z]{2,12}(大学院|大学|高等学校|高校|高専|専門学校)/g, to:'（学校名）'},
  {k:'corp',   l:'企業名',         re:/(株式会社|合同会社|有限会社)[一-龥ぁ-んァ-ヶーA-Za-z0-9]{1,14}|[一-龥ァ-ヶーA-Za-z0-9]{1,14}(株式会社|合同会社)/g, to:'（企業名）'},
  {k:'name',   l:'氏名',           re:/[一-龥]{1,4}[\s　]?[一-龥]{1,4}(さん|くん|君|氏)/g,  to:'（氏名）'}
];
function maskPersonal(text, keep){
  let s = String(text == null ? '' : text);
  const hits = [];
  const guard = [];

  // 落としてはいけない語を一時的に退避する（対象企業名を「（企業名）」にしないため）
  (keep||[]).filter(Boolean).forEach((w, i)=>{
    if(s.indexOf(w) < 0) return;
    const tok = '␀K' + i + '␀';
    guard.push({tok, w});
    s = s.split(w).join(tok);
  });

  // デモ内に実在する人物名は完全一致で落とす（本番では候補者マスタとの突合に相当）
  const names = [(state.profile.name||'').trim()]
    .concat(SEED_CANDIDATES.map(c=>c.name))
    .concat(CA_LIST.map(c=>c.name))
    .filter(n=>n && n.length>=2);
  names.forEach(n=>{
    if(s.indexOf(n) < 0) return;
    if(hits.indexOf('氏名') < 0) hits.push('氏名');
    s = s.split(n).join('（氏名）');
  });

  MASK_RULES.forEach(r=>{
    const before = s;
    s = s.replace(r.re, r.to);          // String#replace は /g でも lastIndex を残さない
    if(s !== before && hits.indexOf(r.l) < 0) hits.push(r.l);
  });

  guard.forEach(g=>{ s = s.split(g.tok).join(g.w); });
  return {text:s, hits};
}
/* 配列をまとめてマスクし、何が落ちたかを合算して返す */
function maskAll(texts, keep){
  const hits = [];
  const out = texts.map(t=>{
    const r = maskPersonal(t, keep);
    r.hits.forEach(h=>{ if(hits.indexOf(h) < 0) hits.push(h); });
    return r.text;
  });
  return {texts:out, hits};
}

const FACTORS = [
  {k:'ind',   l:'業界適性',     w:0.26},
  {k:'trait', l:'強みの一致',   w:0.26},
  {k:'val',   l:'価値観の一致', w:0.20},
  {k:'loc',   l:'勤務地・働き方', w:0.16},
  {k:'pay',   l:'年収レンジ',   w:0.12}
];
function scoreCompany(co, p){
  const f = {};
  f.ind = p.inds.includes(co.ind) ? 96 : (p.inds.length===0 ? 60 : 42);

  const tHit = co.traits.filter(t => p.traits.includes(t)).length;
  f.trait = p.traits.length===0 ? 55 : clamp(38 + (tHit / Math.min(co.traits.length,3)) * 62, 30, 99);

  const vHit = co.vals.filter(v => p.vals.includes(v)).length;
  f.val = p.vals.length===0 ? 55 : clamp(40 + (vHit / co.vals.length) * 60, 30, 99);

  if(p.loc==='remote')      f.loc = co.remote ? 95 : 34;
  else if(p.loc==='any')    f.loc = 74;
  else if(p.loc===co.loc)   f.loc = 95;
  else                      f.loc = co.remote ? 62 : 38;

  const mid = (co.pay[0]+co.pay[1])/2;
  if(co.pay[1] < p.payMin)        f.pay = 30;
  else if(co.pay[0] >= p.payMin)  f.pay = 92;
  else                            f.pay = clamp(52 + (mid - p.payMin)/6, 40, 88);

  let total = FACTORS.reduce((s,x)=> s + f[x.k]*x.w, 0);
  total += (hash(co.id + p.name) % 5) - 2;          // 微小なゆらぎ
  return {factors:f, score: Math.round(clamp(total, 34, 98))};
}
function reasonText(co, p, f){

  if(f.loc>=90)   parts.push('希望の働き方（'+ (p.loc==='remote'?'フルリモート':label(LOCATIONS,p.loc)) +'）に対応しています');
  if(f.pay>=90)   parts.push('提示レンジ下限が希望年収を<b>上回って</b>います');
  if(parts.length===0) parts.push('条件の重なりは限定的ですが、選考難易度と受け入れ実績の観点から提示しています');

============================================================================ */
function logsFor(co){
  const r = rng(hash(co.id)+state.seed%7);
  const n = 3 + Math.floor(r()*2);
  const logs = [];
  const bank = Q_COMMON.concat(Q_BY_IND[co.ind]||[]);
  for(let i=0;i<n;i++){
    const picked = [];
    const used = {};
    while(picked.length < 3){
      const q = bank[Math.floor(r()*bank.length)];
      if(!used[q.q]){ used[q.q]=1; picked.push(q); }
    }
    const pass = r() < 0.68;
    logs.push({
      src:'sample',                       // v1.3: 実投稿と区別する。デモ用の見本データ
      cand: CAND_LABELS[i%CAND_LABELS.length],
      round: ROUNDS[i%ROUNDS.length],
      interviewer: pick(INTERVIEWERS, r),
      minutes: [30,40,45,60][Math.floor(r()*4)],
      when: '2026年' + (7 - (i%4)) + '月',
      atmosphere: pick(ATMOSPHERES, r),
      qs: picked,
      pass,
      advice: pass
        ? '通過者コメント：' + (co.hires[0] || '準備量がそのまま評価に出ました。')
        : '見送り者コメント：' + (co.hires[1] || '深掘りへの備えが足りませんでした。')
    });
  }
  const extra = (state.extraLogs[co.id]||[]);
  const all = extra.concat(logs);
  const passN = all.filter(l=>l.pass).length;
  return {
    logs:all, total:all.length,
    real:extra.length,                        // 実際に投稿された件数
    mine:extra.filter(l=>l.mine).length,      // うち自分が書いたもの
    passRate:Math.round(passN/all.length*100),
    rounds:co.flow.split('→').length-1
  };
}
function prepFor(co, p){
  const bank = (Q_BY_IND[co.ind]||[]).concat(Q_COMMON);
  const r = rng(hash(co.id + p.name));
  const qs = [];
  const used = {};
  while(qs.length < 4 && qs.length < bank.length){
    const q = bank[Math.floor(r()*bank.length)];
    if(!used[q.q]){ used[q.q]=1; qs.push(q); }
  }
  const myTrait = p.traits[0] ? label(TRAITS, p.traits[0]) : 'あなたの強み';
  const frames = qs.map(q => ({
    q: q.q,
    intent: q.i,
    point: q.p,
    star: [
      ['状況', 'いつ・どこで・誰と、を20秒以内で'],
      ['課題', '何が問題だったかを1文で断定する'],
      ['行動', '「'+myTrait+'」が出た行動を主語=自分で語る'],
      ['結果', '数字か、相手の反応の変化で締める']
    ]
  }));
  const back = [
    '入社後1年で最も成果を求められるのはどの領域ですか',
    '御社で活躍している方に共通する行動特性は何ですか',
    (co.flow.indexOf('課題')>=0 ? '実務課題では、どの観点を最も重視されますか' : '今後3年で最も注力される事業を教えてください')
  ];
  return {frames, back, focus:co.hires};
}

   スケジュール枠
============================================================================ */
function slotDays(){
  const out=[]; let d=new Date(); let g=0;
  const wd=['日','月','火','水','木','金','土'];
  while(out.length<4 && g<14){
    d = new Date(d.getTime()+86400000); g++;
    const dow = d.getDay();
    if(dow===0||dow===6) continue;
    const lab = (d.getMonth()+1)+'/'+d.getDate()+'（'+wd[dow]+'）';
    const taken = hash(lab)%3;
    out.push({lab, times:[
      {t:'10:00〜10:30', ok:taken!==0},
      {t:'13:30〜14:00', ok:true},
      {t:'16:30〜17:00', ok:taken!==1},
      {t:'19:00〜19:30', ok:true}
    ]});
  }
  return out;
}

function liveCandidate(){
  const started = state.step!=='landing' && state.step!=='profile' && state.profile.name.trim()!=='';
  if(!started) return null;
  const hasSched = Object.keys(state.schedules).length>0;
  const best = state.scored.length ? state.scored[0].score : 0;
  return {
    id:'live', name:state.profile.name.trim(), stage:state.profile.stage,
    st: hasSched ? 'scheduling' : 'applying',
    matched: state.liked.length, ca:'ca1', days:0, score:best,
    note:'このデモで求職者として操作中の候補者です', live:true
  };
}
function allCandidates(){
  const live = liveCandidate();
  return (live ? [live] : []).concat(SEED_CANDIDATES);
}
function alertsFor(c){
  const a=[];
  const u = dmUnreadFor(c.id);
  if(u) a.push({lv:'danger', t:'未読メッセージ '+u+'件', d:'求職者から返信が届いています'});
  if(c.days>=5) a.push({lv:'danger', t:c.days+'日間アクションなし', d:'離脱リスク。当日中の連絡を推奨'});
  if(c.matched<=1) a.push({lv:'warn', t:'マッチ企業が不足', d:'希望条件の再ヒアリングを提案'});
  if(c.st==='scheduling' && c.days>=1) a.push({lv:'warn', t:'日程が未確定', d:'候補日を追加提示'});
  if(c.st==='offer') a.push({lv:'info', t:'内定フォロー期間', d:'承諾期限の確認'});
  return a;
}
function roiCalc(){
  const r = state.roi;
  const cutRate = r.cut/100;
  const savedHours = r.cas * r.per * r.hrs * cutRate;          // 月間削減時間
  const newPer = r.per / (1 - cutRate);                        // 1人あたり新担当可能数
  const addPer = newPer - r.per;
  const addTotal = addPer * r.cas;                             // 追加担当可能人数
  const turns = 4;                                             // 年間回転（平均在籍3ヶ月想定）
  const addDeals = addTotal * turns * (r.rate/100);            // 年間追加成約数
  const addRev = addDeals * r.fee;                             // 年間増加粗利（万円）
  const payback = addRev>0 ? (r.price / (addRev/12)) : 999;    // 回収月数
  return {savedHours, addPer, addTotal, addDeals, addRev, payback, newPer};
}

const AXES = [

  ENTJ:'牽引・変革型',   ENTP:'発想・開拓型', ENFJ:'育成・巻込型', ENFP:'共感・提案型',

  INTJ:'構想・設計型',   INTP:'探究・論理型', INFJ:'洞察・伴走型', INFP:'理念・探求型'
};
const TYPE_DESC = {

  P:'状況に合わせて組み替えることで力を発揮するタイプ'

function computeWorkType(p){
  const axes = AXES.map(ax=>{
    let a = 0, b = 0;
    (p.traits||[]).forEach(t=>{ if(ax.aTraits.includes(t)) a+=2; if(ax.bTraits.includes(t)) b+=2; });
    (p.vals||[]).forEach(v=>{ if(ax.aVals.includes(v)) a+=1.5; if(ax.bVals.includes(v)) b+=1.5; });
    if(a===b){ a += (hash((p.name||'')+ax.k) % 2) ? 0.5 : -0.5; }   // 同点は決定論的に解消
    const total = Math.max(a+b, 1);
    const pick = a >= b ? ax.a : ax.b;
    const ratio = Math.round((Math.max(a,b)/total)*100);
    return {k:ax.k, pick, ratio, label: a>=b ? ax.al : ax.bl,
            aLabel:ax.al, bLabel:ax.bl, aKey:ax.a, bKey:ax.b,
            aPct: Math.round(a/total*100), bPct: Math.round(b/total*100)};
  });
  const code = axes.map(x=>x.pick).join('');
  return {code, name:TYPE_NAMES[code]||'バランス型', axes,
          lines: code.split('').map(c=>TYPE_DESC[c])};
}

const AV_INK = ['#14110F','#2F4858','#3F6B4F','#8A6B2F','#6B3F5C','#1B3A5C','#4A5D3A','#8C4A55'];
function avatarSvg(seedStr, size, opts){
  const o = opts || {};
  const r = rng(hash(seedStr));
  const base = o.color || AV_INK[Math.floor(r()*AV_INK.length)];
  const paper = '#F5F1E8';
  const s = size || 48;
  const shapes = [];
  const kind = Math.floor(r()*4);
  // 背景
  shapes.push(`<rect width="100" height="100" fill="${base}"/>`);
  if(kind===0){        // 同心円
    shapes.push(`<circle cx="50" cy="50" r="${28+r()*10}" fill="none" stroke="${paper}" stroke-width="7"/>`);
    shapes.push(`<circle cx="50" cy="50" r="${10+r()*8}" fill="${paper}"/>`);
  } else if(kind===1){ // 斜め帯
    const y = 20+r()*30;
    shapes.push(`<path d="M0,${y} L100,${y-18} L100,${y+16} L0,${y+34} Z" fill="${paper}" opacity=".92"/>`);
    shapes.push(`<circle cx="${28+r()*44}" cy="${72+r()*14}" r="9" fill="${paper}"/>`);
  } else if(kind===2){ // 半円＋縦罫
    shapes.push(`<path d="M50,14 A36,36 0 0,1 50,86 Z" fill="${paper}"/>`);
    for(let i=0;i<3;i++) shapes.push(`<rect x="${14+i*9}" y="20" width="3" height="60" fill="${paper}" opacity=".55"/>`);
  } else {             // 市松
    for(let i=0;i<4;i++){
      for(let j=0;j<4;j++){
        if((i+j+Math.floor(r()*2))%2===0) continue;
        shapes.push(`<rect x="${i*25}" y="${j*25}" width="25" height="25" fill="${paper}" opacity=".85"/>`);
      }
    }
  }
  const label = o.label ? `<text x="50" y="50" text-anchor="middle" dominant-baseline="central"
       font-family="serif" font-size="34" fill="${paper}" style="paint-order:stroke" stroke="${base}" stroke-width="5">${esc(o.label)}</text>` : '';
  return `<svg class="av-svg" viewBox="0 0 100 100" width="${s}" height="${s}" aria-hidden="true" focusable="false">${shapes.join('')}${label}</svg>`;
}

const SUPER_LIKE_PER_DAY = 1;

/* ---------------------------------------------------------------------------
   v1.3 — 応募＝企業への情報提供の同意
   「興味あり」は本人の中だけの意思表示であり、企業に情報を渡してよいという意味ではない。
   個人情報保護法27条（第三者提供の制限）により、企業に個人データを渡すには
   本人の同意が要る。よってスワイプと応募を分け、応募の瞬間に同意を取得・記録する。

   この同意記録が、企業ポータル（clientHtml）でのマスク／開示の判断根拠になる。
   同意がない候補者は、企業側からは氏名すら見えない。
--------------------------------------------------------------------------- */
const CONSENT_VER = '1.0';
const CONSENT_SCOPE = [
  '氏名・現在の状況（新卒／第二新卒／中途）',
  'プロフィール（強み・重視すること・希望業界・希望勤務地・希望年収）',
  'AIによる相性スコアとその内訳',
  '自己PRとして入力した文章'
];

const CONSENT_KEEP = '選考終了後6か月。期間経過後は自動的に削除されます。';

function hasConsent(id){ return !!(state.consents && state.consents[id]); }
function consentOf(id){ return (state.consents||{})[id] || null; }
function consentedList(){ return Object.keys(state.consents||{}); }
function grantConsent(id){
  state.consents = state.consents || {};
  state.consents[id] = {at:new Date().toISOString(), ver:CONSENT_VER, scope:CONSENT_SCOPE.slice()};
  state.progress = state.progress || {};
  if(state.progress[id] == null || state.progress[id] < 1) state.progress[id] = 1;
  logEvent('consent_grant', {actorRole:'seeker', applicationId:'live#'+id, ver:CONSENT_VER});
}
/* 撤回＝個人情報保護法35条の利用停止請求に相当。
   同意を消すだけでなく、同意を前提に作られた予定（面談枠）も一緒に取り消す。 */
function revokeConsent(id){
  if(state.consents) delete state.consents[id];
  if(state.progress) delete state.progress[id];
  if(state.schedules) delete state.schedules[id];
  logEvent('consent_revoke', {actorRole:'seeker', applicationId:'live#'+id});
}

/* ---------------------------------------------------------------------------
   選考進捗（内定リスト／注力リストの土台）
   0:応募検討 1:応募中 2:面接調整中 3:面接済み 4:内定
   ステージ1以上は「本人が応募に同意した」状態を意味する。同意がなければ0で固定する。
--------------------------------------------------------------------------- */
const STAGES = ['応募検討','応募中','面接調整中','面接済み','内定'];
function stageOf(id){
  if(!hasConsent(id)) return 0;                       // 未同意は企業に渡らない
  if(state.progress && state.progress[id] != null) return Math.max(1, state.progress[id]);
  return state.schedules[id] ? 2 : 1;
}
function setStage(id, v){
  state.progress = state.progress || {};
  state.progress[id] = clamp(v, hasConsent(id) ? 1 : 0, STAGES.length-1);
}

/* 注力スコア：マッチ度・選考進捗・面談予約の有無・スーパーライクを合成してランキング化 */
function focusScore(c){
  const st = stageOf(c.id);
  let s = c.score * 0.62;
  s += st * 6;                                        // 進んでいるほど注力すべき
  if(state.schedules[c.id]) s += 8;                   // 面談予約済み
  if((state.superLiked||[]).includes(c.id)) s += 10;  // 本人の意思表示
  return Math.round(s);
}
function likedCompanies(){
  return state.liked.map(id=>state.scored.find(c=>c.id===id)).filter(Boolean);

  return likedCompanies().slice().sort((a,b)=>focusScore(b)-focusScore(a));

/* シード候補者のスレッドは決定論的に生成（リロードしても変わらない） */
const DM_SEEDS = [
  ['ca','ご登録ありがとうございます。まずは希望条件のすり合わせをさせてください。'],
  ['me','よろしくお願いします。年収レンジだけ相談させてください。'],

function dmThreadFor(candId){
  if(candId === 'live') return seedDm();
  state.candDm = state.candDm || {};

    const r = rng(hash('dm:'+candId));

    }));
    state.candDm[candId] = arr;
    // 過去のやり取りは基本「既読」で初期化する。
    // 全件未読だと要対応KPIが飽和して意味をなさないため、一部の候補者だけ未読を残す。
    state.caDmRead = state.caDmRead || {};
    const meIdx = arr.map((m,i)=>m.from==='me'?i:-1).filter(x=>x>=0);
    const leaveUnread = meIdx.length && (hash('unread:'+candId) % 4 === 0);
    state.caDmRead[candId] = leaveUnread ? meIdx[meIdx.length-1] : arr.length;
  }
  return state.candDm[candId];
}
/* CAから見た未読 = 自分が最後に開いて以降に届いた、求職者からのメッセージ */
function dmUnreadFor(candId){
  const th = dmThreadFor(candId);
  const read = (state.caDmRead||{})[candId];
  const from = (read == null) ? 0 : read;
  return th.slice(from).filter(m=>m.from==='me').length;
}
function markDmRead(candId){
  state.caDmRead = state.caDmRead || {};
  state.caDmRead[candId] = dmThreadFor(candId).length;
}
